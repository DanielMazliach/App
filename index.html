  <p class="hint" style="padding:0 4px 8px">${filt?`<span class="n">${shown.length}</span> מתוך <span class="n">${hold.length}</span> אחזקות · <b class="n">${ils(sub)}</b> · <span class="n">${(sub/s.total*100).toFixed(1)}%</span> מהתיק`:`<span class="n">${hold.length}</span> אחזקות`}</p>
  <div class="panel">`;
  if(!shown.length)h+=`<div class="row"><span class="nm flat">אין אחזקות בקטגוריה הזו</span></div>`;
  for(const x of shown.slice().sort(sorters[srt])){
    const c=catOf(x);
    h+=`<button class="row dotted" data-hold="${esc(x.id)}">${dot(c)}<span><span class="nm" title="${esc(x.name)}">${esc(short(x.name))}</span><div class="sub">${esc(CATLBL[c])} · <span class="n">${(x.v/s.total*100).toFixed(1)}%</span>${x.cur!=='שקל'?' · '+esc(x.cur):''}</div>${recBadge(x)?`<div class="sub" style="margin-top:4px">${recBadge(x)}</div>`:''}</span>
    <span class="val"><b>${ils(x.v)}</b><span class="n ${cls(x.tg)}">${x.tg?arrow(x.tg)+' '+magIls(x.tg):''}</span></span><svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M7.5 1.5l-6 6 6 6"/></svg></button>`;
  }
  h+=`</div></section>`;
  if(list.length>1){
    h+=`<section><h2>צילומים קודמים</h2><div class="panel">`;
    const tot=p=>p.hold?summarize(p.hold).total:(p.sum?p.sum.total:0);
    for(let i=list.length-1;i>=0;i--){
      const dd=i?tot(list[i])-tot(list[i-1]):0;
      h+=`<div class="row dotted"><span class="spine" style="background:${i?(dd>0?'var(--up)':dd<0?'var(--down)':'var(--line)'):'var(--line)'}"></span><span class="nm n">${dlong(list[i].date)}</span><span class="val"><b>${ils(tot(list[i]))}</b>${i?`<span class="n ${cls(dd)}">${arrow(dd)} ${magIls(dd)}</span>`:'<span class="flat">ראשון</span>'}</span></div>`;
    }
    h+=`</div></section>`;
  }
  return h+(PRIV()?'':`<section class="stackbtns"><label class="btn" style="cursor:pointer" for="pfile">העלאת קובץ חדש</label></section>`);
}
function wirePortfolio(accId){
  wireFolds(layer,(id,open)=>{if(id==='taxp')openPortfolio.taxOpen=open});
  const f=$('#pfile');
  if(f)f.onchange=async e=>{const file=e.target.files[0];f.value='';if(file)await importPortfolio(accId,file)};
  layer.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{openPortfolio.sort=b.dataset.sort;paintPortfolio(accId,true)});
  layer.querySelectorAll('[data-filt]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.filt||null;
    const fromList=b.classList.contains('row');
    openPortfolio.filt=(openPortfolio.filt===k)?null:k;
    paintPortfolio(accId,!fromList);
    if(fromList){const el=$('#holds');if(el)el.scrollIntoView({block:'start',behavior:calm()?'auto':'smooth'})}
  });
  layer.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>openHolding(accId,b.dataset.hold));
  recPaintOpen.list=()=>{const T=stack[stack.length-1];if(T&&T.el.querySelector('[data-hold]'))paintPortfolio(accId,true)};
}
function openHolding(accId,id){
  const list=portsOf(accId),last=list[list.length-1];if(!last||!last.hold)return;
  const x=last.hold.find(y=>y.id===id);if(!x)return;
  const prev=list[list.length-2],old=prev&&prev.hold?prev.hold.find(y=>y.id===id):null;
  const t=ptypeOf(x),c=catOf(x),f=x.cur==='שקל'?ils:v=>nf0.format(Math.round(v))+' '+x.cur;
  openLayer(`<div class="sheet modal" role="dialog" aria-label="${esc(x.name)}"><header><span class="grab" aria-hidden="true"></span><button data-close>סגירה</button><h2>${esc(x.name)}</h2><span></span></header><div class="body">
  <div class="acc-head"><div class="big">${ils(x.v)}</div><div class="meta">${esc(CATLBL[c])} · <span class="n">${(x.v/summarize(last.hold).total*100).toFixed(1)}%</span> מהתיק${x.sym?' · '+esc(x.sym):''}</div></div>
  ${priceBlock(x,accId)}
  <section><div class="panel facts">
  <div><small>כמות</small><b>${nf0.format(x.qty)}</b></div>
  <div><small>שער אחרון</small><b>${nf0.format(Math.round(x.price*100)/100)}</b></div>
  ${x.cur!=='שקל'?`<div><small>שווי במטבע</small><b>${f(x.vc)}</b></div>`:''}
  <div><small>רווח מרכישה</small><b class="${cls(x.gain)}">${signedIls(x.gain)}</b></div>
  <div><small>רווח הון על הנייר</small><b class="${cls(x.tg)}">${signedIls(x.tg)}</b></div>
  <div><small>מס תיאורטי</small><b class="${cls(x.tx)}">${signedIls(x.tx)}</b></div>
  ${old?`<div><small>שינוי מהצילום הקודם</small><b class="${cls(x.v-old.v)}">${signedIls(x.v-old.v)}</b></div>`:''}
  </div></section>
  <p class="hint">${esc(CATLBL[c])}. הסיווג נקבע לפי שם הנייר, והשיוך לישראל או לחו״ל לפי שפת השם והמטבע.</p>
  ${recBlock(x)}</div></div>`);
  const L=stack[stack.length-1];
  const mine=()=>stack[stack.length-1]===L&&L.el.isConnected;      /* the sheet may be gone by the time a fetch lands */
  const paint=()=>{
    if(!mine())return;
    const sec=L.el.querySelector('#recsec');if(!sec)return;
    const tmp=document.createElement('div');tmp.innerHTML=recBlock(x);
    const neu=tmp.firstElementChild;if(!neu)return;
    sec.replaceWith(neu);wire();
  };
  const wire=()=>{
    const tk=L.el.querySelector('[data-tick]');if(tk)tk.onclick=()=>openTicker(x.id,accId);
    const rl=L.el.querySelector('[data-recload]');
    if(rl)rl.onclick=()=>pull(true);
  };
  const pull=async force=>{
    const t=tickOf(x);
    if(!isForeignStock(x)||!t||!S.fh||recBusy.has(t))return;
    const cur=S.rec[t];
    if(!force&&cur&&Date.now()-cur.ts<RECDAY)return;
    recBusy.add(t);paint();
    try{S.rec[t]=await fetchRec(t);delete recErr[t];save()}
    catch(e){recErr[t]=e.message}
    finally{recBusy.delete(t);paint()}
  };
  wire();
  const wirePx=()=>{
    const px=L.el.querySelector('#pxbox');if(!px)return;
    const dat=priceData(x,accId);
    if(dat.src!=='market'){
      wireChart(px,dat.pts,pxFmt());
      /* wireChart opens on the last point, which the headline already states; leave the line for
         the reader's own finger instead of saying the same number twice */
      const ro=px.querySelector('.readout');if(ro)ro.innerHTML='<span class="flat">גע בגרף כדי לראות נקודה</span>';
      return;
    }
    px.querySelectorAll('[data-pxr]').forEach(b=>b.onclick=()=>{pxRange=b.dataset.pxr;paintPx()});
    wireScrub(px,pxSlice(dat.pts,pxRange));
  };
  const wirePxBtn=()=>{const pl=L.el.querySelector('[data-pxload]');if(pl)pl.onclick=()=>pullPx(true)};
  const paintPx=()=>{
    if(!mine())return;
    const sec=L.el.querySelector('#pxsec');if(!sec)return;
    const tmp=document.createElement('div');tmp.innerHTML=priceBlock(x,accId);
    const neu=tmp.firstElementChild;
    if(!neu){sec.remove();return}
    sec.replaceWith(neu);wirePx();wirePxBtn();
  };
  const pullPx=async force=>{
    const t=pxTick(x);
    if(!t||!S.td||pxBusy.has(t))return;
    const cur=PX[t];
    if(!force&&cur&&Date.now()-cur.ts<PXDAY)return;
    pxBusy.add(t);paintPx();
    try{PX[t]=await fetchPx(t);delete pxErr[t]}
    catch(e){pxErr[t]=e.message}
    finally{pxBusy.delete(t);paintPx()}
  };
  wirePx();wirePxBtn();
  pullPx(false);
  recPaintOpen.hold=paint;
  pull(false);                                                     /* opening the share is the request */
}
async function importPortfolio(accId,file){
  const a=ACCOUNTS.find(x=>x.id===accId);
  try{
    const hold=parsePortfolio(await readSheet(file));
    const s=summarize(hold);
    const fields=a.fields.map(([k,nm])=>[k,nm]);
    const guess=S.plink[accId]||(fields.find(([k,nm])=>/שוק ההון|קרנות|השקעות/.test(nm))||fields[fields.length-1])[0];
    openLayer(`<div class="sheet modal" role="dialog" aria-label="קובץ חדש"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>קובץ נקרא</h2><span></span></header><div class="body">
    <div class="acc-head"><div class="big">${ils(s.total)}</div><div class="meta"><span class="n">${hold.length}</span> אחזקות ב${esc(a.short)}</div></div>
    <div class="grp"><div class="fld"><label for="pdate">תאריך הצילום</label><input id="pdate" type="date" value="${today()}"></div>
    <div class="fld"><label for="pfld">ממלא את השדה</label><select id="pfld" style="min-height:44px;border:0;background:transparent;color:var(--tink);font-size:17px">${fields.map(([k,nm])=>`<option value="${k}" ${k===guess?'selected':''}>${esc(nm)}</option>`).join('')}</select></div></div>
    <p class="hint">הצילום יישמר בתיק של ${esc(a.short)}, והסכום יוצע לעדכון היתרות של אותו תאריך.</p>
    <section><button class="btn" id="psave">שמירה</button></section></div></div>`);
    $('#psave').onclick=async()=>{
      const date=$('#pdate').value,fld=$('#pfld').value;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('בחרו תאריך');return}
      addSnapshot(accId,date,hold);S.plink[accId]=fld;await save();
      refreshRecs(false);                       /* new holdings get their consensus without being asked */
      closeLayer();
      const u=S.updates.find(x=>x.date===date);
      setTimeout(async()=>{
        if(u){ if(confirm('לעדכן את היתרה בעדכון מ-'+dlong(date)+' ל-'+ils(s.total)+'?')){u.vals[fld]=Math.round(s.total);await save();toast('היתרה עודכנה')} }
        else if(confirm('אין עדכון יתרות בתאריך הזה. ליצור אחד עם הסכום?')){closeLayer();setTimeout(()=>openForm(null,{date,vals:{[fld]:Math.round(s.total)}}),330);return}
        openPortfolio.filt=null;paintPortfolio(accId);
      },260);
    };
  }catch(err){toast(err.message||'לא הצלחתי לקרוא את הקובץ')}
}

/* ---------- drag sideways between the four pages ----------
   the neighbour is built once, at the moment the drag is recognised, and then both pages ride
   the finger on one spring. letting go hands the spring the finger's speed, so a flick lands
   where it was thrown and a slow drag settles back. */
const tabSwipe={busy:false};
(function tabPager(){
  const app=$('#app');
  let armed=false,on=false,sx=0,sy=0,pid=0,vt=null,dirn=0,ghost=null,W=1,eat=false;
  /* a sideways drag is never a tap, even when there is no page to move to */
  addEventListener('click',e=>{if(eat){eat=false;e.preventDefault();e.stopPropagation()}},true);
  let pending=null;
  /* putting a finger down while the last page is still coasting finishes it there and then,
     so a second swipe never waits for the first to stop moving */
  const finishNow=()=>{
    if(!pending)return;
    const go=pending.go;pending=null;sp.stop();
    const next=go?TABS[TABS.indexOf(tab)+dirn]:null;
    cleanup();
    /* an abandoned drag moved nothing but a transform, so there is no scroll to put back */
    if(next){tab=next;shownTab=next;render();window.scrollTo(0,0)}
  };
  const canStart=()=>!stack.length&&!document.querySelector('.lock')&&!tabSwipe.busy&&TABS.includes(tab);
  const place=u=>{
    const x=u*W;
    view.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
    if(ghost)ghost.style.transform=`translate3d(${(x-dirn*W).toFixed(2)}px,0,0)`;
  };
  const sp=Spring(place);
  const cleanup=()=>{
    if(ghost){ghost.remove();ghost=null}
    view.style.transform='';view.style.willChange='';
    tabSwipe.busy=false;
  };
  addEventListener('pointerdown',e=>{
    if(pending)finishNow();
    if(!canStart())return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('.sheet,input,select,textarea,.chiprow,.segbar'))return;
    armed=true;on=false;eat=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
  },{passive:true});
  addEventListener('pointermove',e=>{
    if(!armed||e.pointerId!==pid)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!on){
      if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){armed=false;return}
      if(Math.abs(dx)<14)return;
      /* in a right-to-left bar the next page sits to the left, so dragging left advances */
      const step=dx>0?1:-1;
      const want=TABS.indexOf(tab)+step;
      if(want<0||want>=TABS.length){armed=false;eat=true;return}
      on=true;tabSwipe.busy=true;eat=true;
      W=innerWidth;dirn=step;
      ghost=pageCache[TABS[want]]||buildPage(TABS[want]);
      delete pageCache[TABS[want]];
      /* a fixed overlay, so bringing it in moves nothing that was already laid out */
      ghost.style.cssText='position:fixed;inset:0;overflow:hidden;z-index:3;background:var(--bg);will-change:transform';
      view.style.willChange='transform';
      document.body.appendChild(ghost);
      sp.jump(0);place(0);
      vt=Velocity();vt.add(e.clientX);
      try{app.setPointerCapture(pid)}catch(err){}
    }
    vt.add(e.clientX);
    let x=dx;
    if(dirn>0&&x<0)x=rubber(x,W);
    if(dirn<0&&x>0)x=rubber(x,W);
    sp.jump(x/W);
  },{passive:true});
  const release=()=>{
    if(!armed)return;armed=false;
    if(!on)return;
    on=false;
    const v=vt?vt.get():0,land=sp.value+project(v)/W*.35;
    const go=dirn>0?land>.3:land<-.3;
    const target=go?dirn:0;
    pending={go};
    sp.to(target,{damping:1,response:go?.22:.26,velocity:Math.max(-8,Math.min(8,v/W))},finishNow);
  };
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
})();

/* ---------- pull down for the rate ----------
   the page itself gives under the finger and resists further the further it goes, which is the
   same rubber the sheets use. letting go past the mark fetches today's rate. */
(function pullToRefresh(){
  const ind=$('#pull'),app=$('#app'),txt=ind.querySelector('.txt');
  const TRIG=62;let y0=null,on=false,busy=false,pid=0;
  const sp=Spring(y=>{
    app.style.transform=y?`translateY(${y.toFixed(1)}px)`:'';
    ind.style.opacity=Math.min(1,y/38).toFixed(2);
    ind.style.transform=`translateY(${(Math.min(y,TRIG)-30).toFixed(1)}px)`;
  },TRIG);
  const atTop=()=>(document.scrollingElement||document.documentElement).scrollTop<=0;
  addEventListener('pointerdown',e=>{
    if(busy||stack.length||tabSwipe.busy||document.querySelector('.lock')||e.pointerType==='mouse'&&e.button!==0)return;
    if(!atTop())return;
    y0=e.clientY;on=false;pid=e.pointerId;
  },{passive:true});
  addEventListener('pointermove',e=>{
    if(y0===null||e.pointerId!==pid||busy||tabSwipe.busy)return;
    const dy=e.clientY-y0;
    if(!on){if(dy<10||!atTop()){if(dy<-6)y0=null;return}on=true;sp.stop()}
    sp.jump(rubber(Math.max(0,dy),innerHeight*.9));
  },{passive:true});
  const release=async()=>{
    if(y0===null)return;const was=on;y0=null;on=false;
    if(!was)return;
    if(sp.value<TRIG*.8){sp.to(0,{damping:1,response:.4});return}
    busy=true;ind.classList.add('go');txt.textContent='';
    sp.to(TRIG,{damping:1,response:.36});
    const recs=refreshRecs(false,RECSOON,5000).catch(()=>0);   /* alongside the rate, not after it */
    let head='';
    try{
      const r=await Promise.race([fetchRate(today()),
        new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),6000))]);  /* don't hang on a dead connection */
      liveRate=r.rate;liveAt=Date.now();
      head='₪'+r.rate.toFixed(3);
      const el=$('#liverate');if(el){el.textContent='₪'+r.rate.toFixed(3);el.classList.remove('flat')}
    }catch(e){head='לא זמין'}
    txt.textContent=head;
    ind.classList.remove('go');
    setTimeout(()=>{sp.to(0,{damping:1,response:.42});busy=false;setTimeout(()=>{txt.textContent=''},300)},850);
    /* the page comes back up at the rate's pace; the consensus lands when it lands */
    const n=await recs;
    if(n)toast(n===1?'המלצה אחת עודכנה':n+' המלצות עודכנו');
  };
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
})();

/* ---------- events / boot ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-acc],[data-acced],[data-edit],[data-close],[data-port]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.acced!==undefined)openAccEditor(t.dataset.acced);
  else if(t.dataset.acc)openAccount(t.dataset.acc,t);
  else if(t.dataset.port)openPortfolio(t.dataset.port);
  else if(t.dataset.edit)openForm(t.dataset.edit);
  else if('close' in t.dataset)closeLayer();
  else ({new:()=>ACCOUNTS.length?openForm():openImport(),backup:doBackup,csv:doCsv,import:openImport,setpass:setPass,rmpass:rmPass,locknow:lockNow,
    privcfg:openPrivCfg,
    recall:async()=>{const k=$('#fhkey');if(k)S.fh=k.value.trim().slice(0,80);
      if(!S.fh){toast('צריך מפתח');return}
      await save();toast('מושך…');const n=await refreshRecs(true);
      toast(n?'עודכנו '+n+' ניירות':'אין ניירות מקושרים');},
    accnew:()=>openAccEditor(null),
    privtog:async()=>{
      if(!S.priv&&!anyMask()){openPrivCfg();toast('בחרו קודם מה יוסתר');return}
      S.priv=!S.priv;closeAllLayers();render();save();toast(S.priv?'מצב פרטי מופעל':'מצב פרטי כבוי');
    },
    wipe:async()=>{if(!confirm('למחוק את כל הנתונים מהמכשיר? אי אפשר לבטל את הפעולה.'))return;if(!confirm('בטוחים? ודאו שיש לכם גיבוי.'))return;S.updates=[];S.ports={};S.ptype={};S.plink={};setConfig([]);await save();tab='home';render();toast('הנתונים נמחקו')}})[t.dataset.act]?.();
});
function start(){$('#tabbar').hidden=false;render();
  /* quietly top up anything stale, once the screen is up and idle */
  (window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>{refreshRecs(false).catch(()=>{})});}
(function boot(){
  const raw=readRaw();
  if(raw&&raw.enc){lockScreen();return}
  if(raw&&raw.data){setConfig(raw.data.accounts);S.updates=clean(raw.data.updates);loadPorts(raw.data)}
  start();
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  for(const k in colCache)delete colCache[k];
  if(cryptoKey||!readRaw()||!readRaw().enc)render();
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
