<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מעקב כספים">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>מעקב כספים</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --ink2:#48484A; --muted:#6C6C70; --sep:#3C3C4329; --line:#E5E5EA; --fill:#7676801F;
  --up:#1F7A35; --down:#D70015; --tint:#007AFF; --focus:#007AFF; --ease:cubic-bezier(.32,.72,0,1);
  /* #007AFF is 4.0:1 on white — fine for an icon or a fill, short of the 4.5:1 a label needs.
     --tink is the blue for text, --btn the blue a filled button can carry white on. */
  --tink:#0A6BD4; --btn:#0A6BD4;
  --blur:saturate(1.6) blur(16px);
  --up2:#5BB974; --chev:#C7C7CC; --knob:#FFFFFF; --onTint:#FFFFFF; --bar:#F9F9F9D9; --barsheet:#F2F2F7CC; --grab:#C7C7CC;
  --press:#E8F0FE; --errbg:#FFE5E7; --errink:#A1000F; --toast:#3A3A3CF2; --ontoast:#FFFFFF;
  --cline:#1C1C1E; --cgrid:#E5E5EA; --cring:#FFFFFF; --ccross:#9AA8B4; --knobshadow:rgba(0,0,0,.16);
  --segbg:#7676801F; --segon:#FFFFFF; --segsh:0 1px 3px #0000001f;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "SF Hebrew", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --txt: -apple-system, system-ui, "SF Hebrew", "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --ink2:#D1D1D6; --muted:#98989F;
    --sep:#54545899; --line:#38383A; --fill:#7676803D;
    --up:#30D158; --down:#FF453A; --tint:#0A84FF; --focus:#0A84FF;
    --tink:#0A84FF; --btn:#0A6BD4;
    --up2:#2B9E4E; --chev:#48484A; --knob:#FFFFFF; --onTint:#FFFFFF; --bar:#1C1C1ED9; --barsheet:#1C1C1ECC; --grab:#48484A;
    --press:#0A84FF2E; --errbg:#3A1216; --errink:#FF6A6A; --toast:#48484AF2; --ontoast:#FFFFFF;
    --cline:#F2F2F7; --cgrid:#2C2C2E; --cring:#1C1C1E; --ccross:#636366; --knobshadow:rgba(0,0,0,.5);
    --segbg:#1C1C1E; --segon:#636366; --segsh:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:var(--txt);color:var(--ink);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
[hidden]{display:none!important}

#app{min-height:100%;background:var(--bg);padding-bottom:calc(76px + var(--sab))}
.view{max-width:560px;margin:0 auto}

/* overview header: the total is the title */
.hero{padding:calc(var(--sat) + 20px) 16px 0}
.hero h1{margin:0 4px;font-size:15px;font-weight:600;color:var(--muted)}
.hero .total{font-family:var(--num);font-size:46px;font-weight:700;letter-spacing:-.024em;line-height:1.08;margin:2px 4px 0;direction:ltr;text-align:right}
.hero .asof{font-size:15px;color:var(--muted);margin:2px 4px 0}
.hero .deltas{display:flex;gap:10px;margin:18px 0 10px}
.hero .deltas div,.chips div{flex:1;background:var(--surface);border-radius:14px;padding:11px 14px}
.hero .deltas small,.chips small{display:block;font-size:13px;color:var(--muted)}
.hero .deltas b,.chips b{font-family:var(--num);font-size:19px;font-weight:600;direction:ltr;display:inline-block}
.hero .deltas span,.chips span{font-size:13px}
.readout{font-size:13px;min-height:18px;color:var(--muted);margin:4px 0 0}

.pagehead{padding:calc(var(--sat) + 20px) 20px 2px}
.pagehead h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.pagehead p{margin:2px 0 0;font-size:15px;color:var(--muted)}

section{margin:28px 16px 0}
section>h2{font-size:22px;font-weight:700;letter-spacing:-.016em;line-height:1.2;margin:0 4px 10px}
section>h2 small,.foldh h2 small{font-weight:400;font-size:15px;letter-spacing:0;color:var(--muted);margin-inline-start:6px}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.foldh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:0;border:0;padding:0;margin:0 4px 6px;
  font:inherit;color:inherit;text-align:start;-webkit-tap-highlight-color:transparent}
.foldh h2{font-size:22px;font-weight:700;letter-spacing:-.016em;line-height:1.2;margin:0}
.foldh .chev{width:9px;height:15px;flex:0 0 auto;fill:none;stroke:var(--tink);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;transform:rotate(-90deg);transition:transform .22s var(--ease)}
.foldh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.foldh:active h2{opacity:.5}
@media(prefers-reduced-motion:reduce){.foldh .chev{transition:none}}
.pad{padding:14px 16px}

.stack{display:flex;gap:2px;height:10px;direction:ltr;margin:2px 0}
.stack i{display:block;height:100%;min-width:3px;border-radius:2px}
.stack i:first-child{border-radius:5px 2px 2px 5px}.stack i:last-child{border-radius:2px 5px 5px 2px}

/* list rows: separators only, inset from the leading edge */
.row{position:relative;display:grid;grid-template-columns:10px 1fr auto;gap:0 12px;align-items:center;width:100%;min-height:60px;text-align:start;padding:10px 16px;background:var(--surface);transition:background .07s ease-out}
.row::before,.facts div::before{content:"";position:absolute;top:0;inset-inline:38px 0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row:first-child::before,.facts div:first-child::before{display:none}
.row .spine{width:10px;height:10px;border-radius:50%}
/* a name that wraps makes the row 82px while its neighbours are 64px, and the column stops
   reading as a column. one line, ellipsis; the full name is on the holding's own page. */
.row .nm{font-weight:400;font-size:17px;display:block;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>span:nth-child(2){min-width:0}
.row .sub{font-size:13px;color:var(--muted);margin-top:1px}
.row .val{text-align:left}
.row .val b{font-family:var(--num);font-size:17px;font-weight:600;display:block;direction:ltr}
.row .val span{font-size:13px}
button.row{grid-template-columns:10px 1fr auto 8px}
button.row:active{background:#E5E5EA}
.row .chev{width:8px;height:14px;fill:none;stroke:var(--chev);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);border:0;padding:0;position:relative;flex:0 0 auto;transition:background .28s cubic-bezier(.32,.72,0,1);-webkit-tap-highlight-color:transparent}
.sw[aria-checked="true"]{background:var(--up)}
.sw i{position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 6px var(--knobshadow),0 0 0 .5px rgba(0,0,0,.04);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sw[aria-checked="true"] i{transform:translateX(-20px)}
.sw:active i{width:29px}
.pmk{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;opacity:.4;vertical-align:-1px}
.rec{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:1px 7px;border-radius:7px;line-height:1.5}
.rec.buy{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.rec.hold{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--ink2)}
.rec.sell{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.rec.none{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);font-weight:500}
.recwait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.recwait .ring{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--muted);animation:ringspin .75s linear infinite;flex:0 0 auto}
.bigrec{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:1px 0 2px}
.bigrec.buy{color:var(--up)}.bigrec.sell{color:var(--down)}
.cons{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 12px}
.cons i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.swatches{display:flex;gap:8px;justify-content:space-between}
.sw-c{width:36px;height:36px;border-radius:50%;border:0;padding:0;position:relative;-webkit-tap-highlight-color:transparent}
.sw-c::before{content:"";position:absolute;inset:-4px;border-radius:50%}  /* 44×44 to the finger */
.sw-c[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--ink)}
.pick1{min-height:44px;border:0;background:transparent;color:var(--tink);font-size:17px;text-align:start}
.row .lblin{width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:3px 0;border-radius:6px;transition:background .15s}
.row .lblin:focus{background:var(--bg);outline:0;padding:3px 7px;margin:0 -7px}
.row .lblin::placeholder{color:var(--chev)}
@media(prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}
.sheet .row{grid-template-columns:1fr auto;min-height:52px}
.row.plain{grid-template-columns:1fr auto}
button.row.plain{grid-template-columns:1fr auto 8px}
.row.plain::before{inset-inline:16px 0}
.sheet .row .spine{display:none}
.sheet .row.dotted{grid-template-columns:10px 1fr auto}
.sheet button.row.dotted{grid-template-columns:10px 1fr auto 8px}
.sheet .row.dotted .spine{display:block}
/* a row inside a sheet that leads somewhere needs a track for its chevron, or the chevron
   wraps onto a line of its own */
.sheet button.row{grid-template-columns:1fr auto 8px}
.sheet button.row.dotted{grid-template-columns:10px 1fr auto 8px}
.sheet .row::before{inset-inline-start:16px}

.facts div{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:10px 16px;background:var(--surface)}
.facts div::before{inset-inline-start:16px}
.facts small{font-size:17px;color:var(--ink)}
.facts b{font-family:var(--num);font-size:17px;font-weight:400;color:var(--muted);direction:ltr}
.facts b.up{color:var(--up)}.facts b.down{color:var(--down)}
.row.link .nm{color:var(--tink);font-weight:500}
.row.link .chev{stroke:var(--tink);stroke-width:2.4}

.note{font-size:15px;color:var(--ink2);background:var(--surface);border-radius:14px;padding:12px 16px;margin:18px 16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.note button{color:var(--tink);font-weight:600;white-space:nowrap;min-height:44px;padding-inline:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--btn);color:var(--onTint);font-weight:600;font-size:17px;padding:0 18px;transition:opacity .09s ease-out,transform .09s ease-out}
.btn.ghost{background:var(--fill);color:var(--tink)}
.btn.danger{background:var(--fill);color:var(--down)}
.btn:active{opacity:.7;transform:scale(.985)}
.btn[disabled]{opacity:.4}
.stackbtns{display:grid;gap:10px}

.tabbar{position:fixed;inset:auto 0 0 0;background:var(--bar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 -.5px 0 var(--sep);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
.tabbar div{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;height:52px;font-size:11px;font-weight:500;color:#8E8E93;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--tink)}

/* pages: a detail page pushes in from the side, a form rises as a sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;touch-action:pan-y;will-change:transform}
.sheet header{position:relative;background:var(--barsheet);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 .5px 0 transparent;transition:box-shadow .2s;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(var(--sat) + 4px) 10px 4px;min-height:calc(var(--sat) + 48px)}
.sheet header.edge{box-shadow:0 .5px 0 var(--sep)}
.sheet header h2{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet header button{color:var(--tink);font-size:17px;min-height:44px;padding:0 6px;justify-self:start;display:flex;align-items:center;gap:3px}
.sheet header button:active{opacity:.4}
.sheet header button svg{width:12px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--sab))}
.sheet footer{background:var(--bar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 -.5px 0 var(--sep);padding:10px 16px calc(10px + var(--sab));display:flex;align-items:center;gap:14px}
.sheet footer .sum{flex:1;min-width:0}
.sheet footer .sum small{display:block;color:var(--muted);font-size:13px}
.sheet footer .sum b{font-family:var(--num);font-size:22px;font-weight:600;letter-spacing:-.01em;direction:ltr;display:inline-block}
.sheet footer .btn{width:auto;min-width:120px}
.sheet.modal{top:calc(var(--sat) + 10px);border-radius:12px 12px 0 0;overflow:hidden}
.sheet.modal header{touch-action:none;padding-top:14px;min-height:58px}
.grab{position:absolute;top:6px;left:0;right:0;height:5px;margin:0 auto;width:36px;border-radius:3px;background:var(--grab)}
.scrim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
.segbar{display:flex;gap:2px;background:var(--segbg);border-radius:9px;padding:2px;margin:0 4px 10px}
.segbar button{position:relative;flex:1;min-height:36px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink)}
.segbar button::before{content:"";position:absolute;inset:-4px 0;pointer-events:auto}
.segbar button[aria-selected="true"]{background:var(--segon);font-weight:600;box-shadow:var(--segsh)}
.chiprow{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  scroll-padding-inline:16px;display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{flex:none;min-height:40px;padding:0 15px;border-radius:20px;background:var(--fill);font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chiprow button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chiprow .spine{width:8px;height:8px;border-radius:50%;flex:none}
.chiprow .spine.hollow{box-shadow:inset 0 0 0 2.5px var(--c)}
.row .spine.hollow,.chiprow .spine.hollow{background:var(--surface)!important;box-shadow:inset 0 0 0 3px var(--c)}
.chiprow button[aria-pressed="true"] .spine.hollow{background:var(--ink)!important}
button.row[aria-pressed="true"]{background:var(--press)}
button.row[aria-pressed="true"] .nm{font-weight:600}
#app,#tabbar{will-change:transform}

.acc-head{padding:6px 20px 0}
.acc-head h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.acc-head h1 span{font-size:.5em;vertical-align:middle}
.acc-head .big{font-family:var(--num);font-size:34px;font-weight:600;letter-spacing:-.02em;direction:ltr;text-align:right;margin-top:14px;line-height:1.1}
.acc-head .meta{color:var(--muted);font-size:15px;margin-top:2px}
.chips{display:flex;gap:10px;margin:18px 16px 0}

/* forms: grouped rows, borderless fields */
.grp{margin:22px 16px 0;background:var(--surface);border-radius:14px;overflow:hidden}
.grp h3{margin:0;padding:12px 16px 2px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.grp h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.grp h3 small{font-weight:400;font-size:13px}
.fld{position:relative;display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;min-height:48px;padding:3px 16px}
.fld + .fld::before{content:"";position:absolute;top:0;inset-inline:16px 0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.fld label{font-size:17px}
.fld label small{display:block;color:var(--muted);font-size:13px;direction:rtl}
.fld input{width:100%;height:40px;border:0;border-radius:8px;padding:0 8px;font-family:var(--num);font-size:17px;direction:ltr;text-align:left;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;transition:background .15s}
.fld input::placeholder{color:var(--chev)}
.fld input:focus{background:var(--bg);outline:0}
.fld input[type=date]{-webkit-appearance:none;appearance:none}
.fld.wide{grid-template-columns:96px 1fr}
.fld.wide input{direction:rtl;text-align:start;font-family:inherit;font-variant-numeric:normal}
.fld .inl{display:flex;gap:4px;align-items:center}
.fld .inl button{white-space:nowrap;font-size:15px;color:var(--tink);padding:0 4px;min-height:44px}
.fld .inl button:active{opacity:.4}
.fld .inl .atbtn{color:var(--tink);font-size:15px;min-height:44px;display:flex;align-items:center;cursor:pointer;white-space:nowrap}
.fld .inl .atbtn.on{color:var(--up);font-weight:600;font-size:13.5px}
.hint{font-size:13px;color:var(--muted);padding:6px 16px 12px;margin:0}
.err{margin:16px 16px 0;background:var(--errbg);color:var(--errink);border-radius:12px;padding:11px 14px;font-size:15px}

table.cmp{width:100%;border-collapse:collapse;font-size:15px}
table.cmp th{font-weight:400;color:var(--muted);font-size:13px;text-align:left;padding:12px 8px 6px}
table.cmp th:first-child,table.cmp td:first-child{text-align:right;padding-inline-start:16px}
table.cmp td{padding:12px 8px;box-shadow:inset 0 .5px 0 var(--sep);text-align:left}
table.cmp td:last-child,table.cmp th:last-child{padding-left:16px}
table.cmp tr.tot td{font-weight:600}
table.cmp .d small{display:block;font-size:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{font-size:13px;color:var(--muted);display:block;margin:0 4px}
.pick select{width:100%;height:48px;border:0;border-radius:12px;background:var(--surface);color:var(--tink);padding:0 12px;font-size:17px;margin-top:6px}
.empty{text-align:center;padding:56px 28px;color:var(--muted)}
.empty h2{font-size:22px;font-weight:700;letter-spacing:-.016em;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 22px;font-size:15px}
.cover{position:fixed;inset:0;background:var(--bg);z-index:38}
/* the lock screen keeps its own ground in both colour schemes: two slow lights drifting behind
   a deep blue, so the locked state is recognised before a word is read */
.lock{position:fixed;inset:0;z-index:40;overflow:hidden;background:#062A52;color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(78px + var(--sat)) 24px calc(34px + var(--sab))}
.lock .blob{position:absolute;border-radius:50%;filter:blur(58px);will-change:transform;pointer-events:none}
.lock .b1{width:320px;height:320px;top:-40px;inset-inline-start:-70px;background:#1E7FE0;opacity:.72;animation:ldrift1 26s ease-in-out infinite}
.lock .b2{width:300px;height:300px;top:42%;inset-inline-end:-90px;background:#1FAE9C;opacity:.5;animation:ldrift2 32s ease-in-out infinite}
@keyframes ldrift1{0%{transform:translate(-6%,-4%) scale(1)}50%{transform:translate(14%,10%) scale(1.22)}100%{transform:translate(-6%,-4%) scale(1)}}
@keyframes ldrift2{0%{transform:translate(10%,6%) scale(1.1)}50%{transform:translate(-12%,-8%) scale(.9)}100%{transform:translate(10%,6%) scale(1.1)}}
.lock .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:330px;height:100%}
.lock h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:16px 0 0}
.lock p{margin:5px 0 0;color:#CFE2F7;font-size:15px;text-align:center}
.lock .dots{display:flex;gap:18px;margin-top:34px;height:13px;direction:ltr}
.lock .dots i{width:13px;height:13px;border-radius:50%;box-sizing:border-box;border:1.5px solid #FFFFFF66;
  transition:background .18s ease,transform .18s cubic-bezier(.32,.72,0,1)}
.lock .dots i.on{background:#fff;border-color:#fff;transform:scale(1.12)}
.lock .msg{min-height:22px;margin-top:16px;font-size:15px;font-weight:600;color:#FFD3CE;text-align:center}
.lock .pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px;justify-items:center;margin:auto 0 28px;direction:ltr}
.lock .pad button{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;
  border:0;background:#FFFFFF1F;color:#fff;font-family:var(--num);font-size:31px;font-weight:400}
.lock .pad button:active{background:#FFFFFF3D}
.lock .pad button.bare{background:transparent;font-size:26px}
.lock .pad button[disabled]{opacity:.4}
.lock .shake{animation:lshake .42s ease-in-out}
@keyframes lshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.lock .blob{animation:none}.lock .shake{animation:none}.lock .dots i{transition:none}}
textarea{width:100%;min-height:120px;border:0;border-radius:10px;background:var(--bg);padding:10px;font-size:13px;direction:ltr;font-family:ui-monospace,Menlo,monospace}
svg.chart{display:block;width:100%;height:auto;touch-action:pan-y;direction:ltr}
svg.chart text{font-family:var(--num);font-size:11px;fill:#8E8E93}
svg.chart .g{stroke:var(--cgrid)}
svg.chart .cross{stroke:var(--ccross)}
svg.chart circle{stroke:var(--cring)}
/* the trading chart runs to both edges of the sheet; only its head and its tabs are inset */
.pxwrap{margin:0 -16px}
.pxhead{padding:0 20px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.pxhead .pxval{font-size:30px;font-weight:700;font-family:var(--num);letter-spacing:-.02em;line-height:1.1;flex:0 0 auto}
.pxhead .pxdelta{font-size:15px;font-weight:600;flex:0 0 auto}
.pxhead .pxwhen{flex:1 0 100%;font-size:12.5px;color:var(--muted);min-height:16px}
svg.pxchart{display:block;width:100%;height:170px;touch-action:pan-y;direction:ltr;overflow:visible}
svg.pxchart .pxbase{stroke:var(--muted);stroke-opacity:.45;stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
svg.pxchart .pxcross{stroke:var(--ccross);stroke-width:1}
svg.pxchart .pxknob{stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke}
.pxtabs{display:flex;gap:2px;background:var(--segbg);border-radius:9px;padding:2px;margin:14px 20px 0}
.pxtabs button{position:relative;flex:1;min-height:36px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500}
.pxtabs button::before{content:"";position:absolute;inset:-4px 0;pointer-events:auto}
.pxtabs button[aria-selected="true"]{background:var(--segon);font-weight:600;box-shadow:var(--segsh)}
.hint.pxnote{display:flex;align-items:center;justify-content:space-between;gap:12px;white-space:nowrap}
.hint.pxnote>span{overflow:hidden;text-overflow:ellipsis}
.hint.pxnote button{flex:0 0 auto;border:0;background:transparent;color:var(--tink);font:inherit;font-size:13px;font-weight:600;min-height:44px;padding-inline:4px}
.chart-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.chart-top b{font-size:22px;font-family:var(--num);letter-spacing:-.2px}
.chart-top .n{font-size:14px;font-weight:600}
.chartbox .readout{min-height:17px;font-size:12.5px;color:var(--muted);margin:0 0 4px;direction:rtl}
.roll .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.roll{display:inline-flex;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.roll .dig,.roll .sep{display:inline-block;height:1em;line-height:1;vertical-align:bottom}
.roll .dig{overflow:hidden}
.roll .dig u{display:block;text-decoration:none;will-change:transform}
.roll .dig u b{display:block!important;font-weight:inherit;font-size:inherit;height:1em;line-height:1;letter-spacing:inherit}
#topbar{position:fixed;inset:0 0 auto 0;z-index:6;padding:var(--sat) 16px 0;height:calc(var(--sat) + 44px);
  display:flex;align-items:center;justify-content:center;background:var(--bar);
  box-shadow:0 .5px 0 var(--sep);opacity:0;transform:translateY(-8px);pointer-events:none;
  visibility:hidden;
  transition:opacity .2s ease-out,transform .2s var(--ease),visibility 0s linear .2s}
#topbar.on{opacity:1;transform:none;visibility:visible;transition-delay:0s,0s,0s;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#topbar span{font-size:16px;font-weight:600;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar span.n{font-family:var(--num);direction:ltr}
#pull{position:fixed;inset:calc(var(--sat) + 2px) 0 auto 0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px;
  opacity:0;pointer-events:none;color:var(--muted);font-size:13px}
#pull .ring{width:20px;height:20px;border-radius:50%;border:2.2px solid var(--line);border-top-color:var(--muted)}
#pull.go .ring{animation:ringspin .75s linear infinite}
#pull .txt{font-family:var(--num);direction:ltr}
@keyframes ringspin{to{transform:rotate(360deg)}}
.moving .tabbar,.moving .sheet header,.moving .sheet footer,.moving #topbar.on{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.toast{position:fixed;inset:auto 0 calc(76px + var(--sab)) 0;width:max-content;max-width:calc(100% - 40px);margin:0 auto;background:var(--toast);color:var(--ontoast);border-radius:22px;padding:11px 20px;text-align:center;z-index:30;font-size:15px}

@media (prefers-reduced-transparency:reduce){
  .tabbar,.sheet header,.sheet footer{background:var(--bg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
@media (prefers-contrast:more){
  :root{--sep:#3C3C4399;--muted:#48484A}
  .panel,.chips div,.hero .deltas div,.grp{outline:1px solid #8E8E93;outline-offset:-1px}
}
@media (prefers-reduced-motion:no-preference){
  svg.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s var(--ease) forwards}
  svg.chart .pop{opacity:0;animation:pop .3s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0}to{opacity:1}}
  .toast{animation:toastin .25s ease-out}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}}
}
</style>
</head>
<body>
<div id="pull" aria-hidden="true"><span class="ring"></span><span class="txt"></span></div>
<div id="topbar" aria-hidden="true"><span></span></div>
<div id="app"><div class="view" id="view"></div></div>
<div id="scrim" aria-hidden="true"></div>
<nav class="tabbar" id="tabbar" hidden><div>
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>סקירה</button>
  <button data-tab="updates"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>עדכונים</button>
  <button data-tab="compare"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>השוואה</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>הגדרות</button>
</div></nav>
<div id="layer"></div>
<script>
'use strict';
/* ---------- model ---------- */
/* accounts are not part of the code: they arrive with the backup file and live only on the device */
let ACCOUNTS=[],FIELDS=[];
function setConfig(list){const ok=[];for(const a of Array.isArray(list)?list:[]){if(!a||!a.id||!Array.isArray(a.fields))continue;ok.push({id:String(a.id),name:String(a.name||a.id),short:String(a.short||a.name||a.id),color:/^#[0-9a-f]{6}$/i.test(a.color)?a.color:'#44566A',cur:a.cur==='USD'?'USD':'ILS',fields:a.fields.filter(f=>Array.isArray(f)&&f[0]).map(f=>[String(f[0]),String(f[1]||f[0]),['cur','fx','cap','sav'].includes(f[2])?f[2]:'cap',!!f[3]])})}ACCOUNTS=ok;FIELDS=ok.flatMap(a=>a.fields.map(f=>f[0]))}
const KEY='ft.data.v1', META='ft.meta.v1';
let S={updates:[],ports:{},ptype:{},plink:{},priv:false,pmask:{},fh:'',tick:{},rec:{}}, cryptoKey=null, encMeta=null, tab='home';

const num=v=>{
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  const raw=String(v??'');
  const paren=/\(\s*[\d.,]+\s*\)/.test(raw);               /* (1,000) means minus, in a bank file */
  const x=parseFloat(raw.replace(/[^0-9.\-]/g,''));          /* commas, ₪, $, spaces, RTL marks */
  if(!Number.isFinite(x))return 0;
  return paren?-Math.abs(x):x;
};
/* ---------- private mode ----------
   for when the screen is not only mine: an account can be left out altogether, or shown at
   half its value. display only — while it is on nothing can be written, so a masked number
   can never be saved back as real data. the backup and the CSV always hold the real amounts. */
const PRIV=()=>!!S.priv;
const maskOf=id=>{const m=S.pmask&&S.pmask[id];return m==='half'||m==='hide'?m:'full'};
const facOf=id=>!PRIV()?1:(maskOf(id)==='hide'?0:maskOf(id)==='half'?.5:1);
const isHidden=id=>PRIV()&&maskOf(id)==='hide';
const visAcc=()=>ACCOUNTS.filter(a=>!isHidden(a.id));
const anyMask=()=>ACCOUNTS.some(a=>maskOf(a.id)!=='full');
const share=(v,t)=>t?(v/t*100).toFixed(1):'0.0';

function calcAt(u,raw){
  const r={acc:{},usdAcc:{},total:0,usd:0};
  for(const a of ACCOUNTS){const q=raw?1:facOf(a.id);let s=0;for(const [k] of a.fields){const m=a.cur==='USD'?num(u.rate):1;const v=num(u.vals[k])*m*q;s+=v;if(a.cur==='USD'){r.usd+=num(u.vals[k])*q;r.usdAcc[a.id]=(r.usdAcc[a.id]||0)+num(u.vals[k])*q}}r.acc[a.id]=s;r.total+=s}
  return r;
}
const calc=u=>calcAt(u,false);     /* what the screen shows */
const calcRaw=u=>calcAt(u,true);   /* what leaves the app */
const sorted=()=>[...S.updates].sort((a,b)=>a.date<b.date?-1:1);

/* ---------- colour ----------
   account colours are chosen by the person, so some of them are too dark to read on a dark
   surface. rather than overriding their choice, the same hue is lifted to a readable lightness
   while the scheme is dark, and handed back untouched while it is light. */
const DARK=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const hex2hsl=h=>{
  const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return[0,0,l];
  const s=l>.5?d/(2-mx-mn):d/(mx+mn);
  let hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;
  return[hh*60,s,l];
};
const hsl2hex=(h,s,l)=>{
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+t.map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
};
const colCache={};
function acol(hex){
  if(!DARK()||!/^#[0-9a-f]{6}$/i.test(hex))return hex;
  const k=hex.toLowerCase();if(colCache[k])return colCache[k];
  const [h,sa,l]=hex2hsl(k);
  /* lift, don't level: raising every colour to the same lightness would merge two accounts
     whose hues are close and whose only difference was how dark they were. */
  const nl=Math.max(.42,Math.min(.82,l+.20*(1-l)));
  return colCache[k]=nl<=l+.005?hex:hsl2hex(h,Math.min(sa,.85),nl);
}
const chartInk=()=>DARK()?'#F2F2F7':'#1C1C1E';

/* ---------- format ---------- */
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const ils=v=>'₪'+nf0.format(Math.round(v));
const usd=v=>'$'+nf0.format(Math.round(v));
const signedBy=(v,f)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v));   // e.g. +₪40,873 / −$1,989
const signedIls=v=>signedBy(v,ils);
/* beside an arrow the sign is the third thing saying the same thing, after the arrow and the
   colour; the magnitude alone reads cleaner and is shorter */
const magIls=v=>ils(Math.abs(v));
/* a plain CSS ellipsis cuts by pixel and lands inside a number — "ממשלתית צמודה 2% 0431"
   became "…31 2%". trimming at the last space keeps every token whole; the CSS ellipsis
   stays on as a backstop for a name of unusually wide glyphs. */
function short(t,n=20){
  const x=String(t||'').trim();
  if(x.length<=n)return x;
  const cut=x.slice(0,n), sp=cut.lastIndexOf(' ');
  return (sp>n*0.5?cut.slice(0,sp):cut).replace(/[\s.,/-]+$/,'')+'…';
}
const magBy=(v,f)=>f(Math.abs(v));
const pct=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%';
const cls=v=>v>0.5?'up':v<-0.5?'down':'flat';
const arrow=v=>v>0.5?'▲':v<-0.5?'▼':'●';
const dshort=d=>{const [y,m,dd]=d.split('-');return +dd+'/'+ +m+'/'+y.slice(2)};
const dlong=d=>{const [y,m,dd]=d.split('-');return +dd+'/'+ +m+'/'+y};
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact=v=>{const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e4?(v/1e3).toFixed(a>=1e5?0:1)+'K':nf0.format(v)};

/* ---------- storage (optionally encrypted on device) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function readRaw(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function meta(){try{return JSON.parse(localStorage.getItem(META)||'{}')}catch(e){return {}}}
function setMeta(p){try{localStorage.setItem(META,JSON.stringify({...meta(),...p}))}catch(e){}}
let saveChain=Promise.resolve();
function save(){
  saveChain=saveChain.then(async()=>{
    const plain=JSON.stringify({v:3,accounts:ACCOUNTS,updates:S.updates,ports:S.ports,ptype:S.ptype,plink:S.plink,priv:S.priv,pmask:S.pmask,fh:S.fh,td:S.td,tick:S.tick,rec:S.rec});
    let out;
    if(cryptoKey){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(plain));out={enc:1,salt:encMeta.salt,iv:b64(iv),ct:b64(ct)};if(encMeta.pinLen)out.pinLen=encMeta.pinLen}
    else out={enc:0,data:JSON.parse(plain)};
    localStorage.setItem(KEY,JSON.stringify(out));
  }).catch(e=>toast('השמירה נכשלה: '+e.message));
  return saveChain;
}
/* iOS keeps a home-screen app alive, so a code checked only at cold start would almost never be asked for */
const LOCK_AFTER=120000;      // ask again once the app has been away this long
let hiddenAt=0,coverEl=null;
function cover(on){
  if(on){ if(!coverEl&&cryptoKey){coverEl=document.createElement('div');coverEl.className='cover';document.body.appendChild(coverEl)} }
  else if(coverEl){coverEl.remove();coverEl=null}
}
function lockNow(){
  cover(false);
  if(!cryptoKey||document.querySelector('.lock'))return;
  cryptoKey=null;                       // the key leaves memory until the code is re-entered
  closeAllLayers();
  S.updates=[];S.ports={};S.ptype={};S.plink={};S.priv=false;S.pmask={};S.fh='';S.td='';S.tick={};S.rec={};PX={};$('#tabbar').hidden=true;view.innerHTML='';
  lockScreen();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();cover(true)}
  else if(cryptoKey&&hiddenAt&&Date.now()-hiddenAt>LOCK_AFTER){hiddenAt=0;lockNow()}
  else {hiddenAt=0;cover(false)}
});
window.addEventListener('pagehide',()=>{hiddenAt=Date.now();cover(true)});
function applyPlain(pt){
  const d=JSON.parse(new TextDecoder().decode(pt));
  setConfig(d.accounts);S.updates=clean(d.updates);loadPorts(d);
}
async function unlock(pass){
  const raw=readRaw();
  if(raw.wrap){
    /* written by the build that offered Face ID: the file is sealed with a random data key,
       and that key is wrapped under the passcode. Read it, then rewrite in this build's format. */
    const w=raw.wrap.pass;
    if(!w)throw new Error('no-pass-wrap');
    const kek=await deriveKey(pass,unb64(w.salt));
    const dkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},kek,unb64(w.ct));
    const dk=await crypto.subtle.importKey('raw',dkRaw,{name:'AES-GCM'},false,['decrypt']);
    applyPlain(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},dk,unb64(raw.ct)));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    cryptoKey=await deriveKey(pass,salt);encMeta={salt:b64(salt),pinLen:pinLenOf(pass)};
    await save();
    return;
  }
  const k=await deriveKey(pass,unb64(raw.salt));
  applyPlain(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},k,unb64(raw.ct)));
  cryptoKey=k;encMeta={salt:raw.salt,pinLen:pinLenOf(pass)};
  if(storedPinLen(raw)!==encMeta.pinLen)save();
}
function loadPorts(d){
  S.ports={};S.ptype={};S.plink={};S.priv=!!d.priv;S.pmask={};
  S.fh=typeof d.fh==='string'?d.fh.trim().slice(0,80):'';
  S.td=typeof d.td==='string'?d.td.trim().slice(0,80):'';
  S.tick={};for(const k in (d.tick||{})){const v=String(d.tick[k]||'').toUpperCase().replace(/[^A-Z0-9.\-]/g,'').slice(0,12);if(v)S.tick[String(k)]=v}
  S.rec={};for(const k in (d.rec||{})){const r=d.rec[k];if(r&&typeof r==='object')S.rec[String(k)]={ts:num(r.ts),sb:num(r.sb),b:num(r.b),h:num(r.h),s:num(r.s),ss:num(r.ss),period:String(r.period||''),tm:num(r.tm),tl:num(r.tl),th:num(r.th),px:num(r.px)}}
  const ok=new Set(ACCOUNTS.map(a=>a.id));
  for(const id in (d.pmask||{}))if(ok.has(id)&&['half','hide'].includes(d.pmask[id]))S.pmask[id]=d.pmask[id];
  for(const id in (d.ports||{})){
    if(!ok.has(id))continue;
    const list=(d.ports[id]||[]).filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date));
    if(list.length)S.ports[id]=list;
  }
  for(const k in (d.ptype||{}))if(['stock','bond','fund'].includes(d.ptype[k]))S.ptype[String(k)]=d.ptype[k];
  for(const id in (d.plink||{}))if(ok.has(id))S.plink[id]=String(d.plink[id]);
}
function clean(list){
  const out=[];const seen=new Set();
  for(const u of Array.isArray(list)?list:[]){
    if(!u||!/^\d{4}-\d{2}-\d{2}$/.test(u.date)||seen.has(u.date))continue;seen.add(u.date);
    const vals={};for(const k of FIELDS)vals[k]=num(u.vals&&u.vals[k]);
    out.push({date:u.date,vals,rate:num(u.rate)});
  }
  return out;
}

/* ---------- charts ---------- */
function niceTicks(lo,hi,n=4){
  if(lo===hi){const p=Math.abs(lo)*0.01||1;lo-=p;hi+=p}
  const pad=(hi-lo)*0.18;lo-=pad;hi+=pad;
  const mag=Math.pow(10,Math.floor(Math.log10((hi-lo)/n||1)));
  let step=mag,a=0,b=0;
  for(const f of [1,2,2.5,5,10,20,25,50,100]){                 /* climb until the grid is n+1 lines at most */
    step=f*mag;a=Math.floor(lo/step)*step;b=Math.ceil(hi/step)*step;
    if(Math.round((b-a)/step)+1<=n+1)break;
  }
  const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));
  return {min:a,max:b,ticks:t};
}
function tickFmt(ticks){const span=ticks[ticks.length-1]-ticks[0];const mx=Math.max(...ticks.map(Math.abs));
  if(mx>=1e6){const d=span/ (ticks.length-1)>=1e5?1:span/(ticks.length-1)>=1e4?2:3;return v=>(v/1e6).toFixed(d)+'M'}
  if(mx>=1e4){const d=span/(ticks.length-1)>=1e3?0:1;return v=>(v/1e3).toFixed(d)+'K'}
  return v=>nf0.format(v)}
/* line with point markers; y-axis hugs the data (a bit below the lowest, a bit above the highest) */
function lineChart(pts,color,o={}){
  const W=340,H=o.h||170,AX=46,PR=10,T=14,B=24,dark=!!o.dark;   // AX: width reserved for the value axis, on the left
  const vs=pts.map(p=>p.v);const {min,max,ticks}=niceTicks(Math.min(...vs),Math.max(...vs));const tf=tickFmt(ticks);
  /* the x axis is time, not position in the list: a month of silence is drawn a month wide, so
     entries made weekly and entries made quarterly no longer look alike. falls back to even
     spacing if a date is missing or every point shares one date. */
  const L0=AX+10,R0=W-PR-10;
  const tms=pts.map(p=>Date.parse(p.d)),span=tms[tms.length-1]-tms[0];
  const byTime=tms.every(Number.isFinite)&&span>0;
  const x=i=>pts.length===1?(AX+(W-PR-AX)/2)
    :byTime?L0+(tms[i]-tms[0])*(R0-L0)/span
    :L0+i*(R0-L0)/(pts.length-1);
  const y=v=>T+(max-v)*(H-T-B)/(max-min);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'גרף')}">`;
  for(const t of ticks){s+=`<line class="g" x1="${AX}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}" stroke-width="1"/><text x="${AX-7}" y="${y(t)+3.5}" text-anchor="end">${tf(t)}</text>`}
  /* dates are now placed by where the point actually sits, so they are kept apart by pixels
     rather than by every n-th point; the last one is always labelled */
  const MINLBL=52,lab=[];
  for(let i=0;i<pts.length;i++)if(!lab.length||x(i)-x(lab[lab.length-1])>=MINLBL)lab.push(i);
  if(lab[lab.length-1]!==pts.length-1){
    if(x(pts.length-1)-x(lab[lab.length-1])<MINLBL)lab.pop();
    lab.push(pts.length-1);
  }
  for(const i of lab)s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${dshort(pts[i].d)}</text>`;
  s+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  if(pts.length>1)s+=`<polyline ${o.anim?'class="draw" pathLength="1"':''} fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`;
  const r=pts.length>30?0:pts.length>16?3:4.5;
  if(r)pts.forEach((p,i)=>{s+=`<circle ${o.anim?`class="pop" style="animation-delay:${(.25+.75*i/Math.max(pts.length-1,1)).toFixed(2)}s"`:''} cx="${x(i)}" cy="${y(p.v)}" r="${r}" fill="${color}" stroke-width="2"/>`});
  s+=`<rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent" data-xs="${pts.map((p,i)=>x(i).toFixed(1)).join(',')}"/></svg>`;
  return s;
}
function spark(vs,color){if(vs.length<2)return '';const lo=Math.min(...vs),hi=Math.max(...vs),sp=hi-lo||1;
  const p=vs.map((v,i)=>(3+i*54/(vs.length-1)).toFixed(1)+','+(19-(v-lo)*16/sp).toFixed(1)).join(' ');
  const last=p.split(' ').pop().split(',');
  return `<svg class="spark" viewBox="0 0 60 22" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`}
function readoutText(p,prev,fmt){let t=`<span class="n">${dlong(p.d)}</span> · <b class="n">${fmt(p.v)}</b>`;if(prev){const d=p.v-prev.v;t+=` · <span class="n ${cls(d)}">${arrow(d)} ${magBy(d,fmt)}</span>`}return t}
function wireChart(box,pts,fmt){
  if(!box||offscreen)return;
  const svg=box.querySelector('svg.chart'),out=box.querySelector('.readout');if(!svg||!out)return;
  const hit=svg.querySelector('.hit'),cross=svg.querySelector('.cross');const xs=hit.dataset.xs.split(',').map(Number);
  const show=i=>{out.innerHTML=readoutText(pts[i],pts[i-1],fmt)};
  show(pts.length-1);
  const move=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*340/r.width;let b=0;xs.forEach((v,i)=>{if(Math.abs(v-px)<Math.abs(xs[b]-px))b=i});
    cross.setAttribute('x1',xs[b]);cross.setAttribute('x2',xs[b]);cross.setAttribute('visibility','visible');show(b)};
  hit.addEventListener('pointerdown',move);hit.addEventListener('pointermove',move);
}

/* ---------- rolling numbers ----------
   a total that jumps has no relation to the one before it. each digit column is a strip that
   springs to its new face, and only the columns that actually changed move. the springs are
   interruptible, so a second change mid-flight redirects rather than queues. */
const rollMem={};
function roll(el,id,val,fmt,o={}){
  const next=fmt(val),prev=rollMem[id];
  rollMem[id]=val;
  if(prev===undefined||prev===val||calm()||PRIV()){el.classList.remove('roll');el.textContent=next;return}
  const a=[...fmt(prev)],b=[...next];
  el.textContent='';el.classList.add('roll');
  /* the strips spell out every digit face, so the value is carried separately for a screen reader */
  const sr=document.createElement('span');sr.className='sr';sr.textContent=next;el.appendChild(sr);
  const cells=document.createElement('span');cells.setAttribute('aria-hidden','true');el.appendChild(cells);
  const moves=[];
  b.forEach((ch,i)=>{
    const cell=document.createElement('span');
    const j=a.length-(b.length-i);                   // line the two numbers up from the right
    const from=/\d/.test(ch)&&j>=0&&/\d/.test(a[j])?+a[j]:null;
    if(from===null||from===+ch){                     /* a digit that does not move is just a digit */
      cell.className='sep';cell.textContent=ch;cells.appendChild(cell);return;
    }
    cell.className='dig';
    const strip=document.createElement('u'),to=+ch;
    const lo=Math.min(from,to),hi=Math.max(from,to); /* only the faces it actually passes */
    for(let d=lo;d<=hi;d++){const f=document.createElement('b');f.textContent=d;strip.appendChild(f)}
    const n=hi-lo+1;
    cell.appendChild(strip);
    const sp=Spring(y=>{strip.style.transform=`translateY(${(-(y-lo)*100/n).toFixed(3)}%)`});
    sp.jump(from);
    moves.push([sp,to]);
    cells.appendChild(cell);
  });
  const gap=o.stagger!=null?o.stagger:34,res=o.response||.5;
  moves.forEach(([sp,target],k)=>{
    const go=()=>sp.to(target,{damping:.8,response:res});
    gap?setTimeout(go,k*gap):go();
  });
}
const ILSROLL=v=>ils(v);
function paintRolls(){
  if(offscreen)return;
  document.querySelectorAll('[data-roll]').forEach(el=>roll(el,el.dataset.roll,+el.dataset.rv,ILSROLL));
}

const TABS=['home','updates','compare','settings'];
const VIEWS={home:viewHome,updates:viewUpdates,compare:viewCompare,settings:viewSettings};
/* build a page into a node of our own, with every wiring step standing down */
let pageCache={};
function warmPages(){
  const i=TABS.indexOf(tab);if(i<0)return;
  for(const t of [TABS[i-1],TABS[i+1]])if(t&&!pageCache[t]){try{pageCache[t]=buildPage(t)}catch(e){}}
}
function buildPage(t){
  const node=document.createElement('div');node.className='view';
  const keepView=view,keepTab=tab,keepOff=offscreen,keepFirst=firstPaint;
  view=node;tab=t;offscreen=true;firstPaint=false;
  try{VIEWS[t]()}catch(e){node.innerHTML=''}
  view=keepView;tab=keepTab;offscreen=keepOff;firstPaint=keepFirst;
  return node;
}
function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const dir=shownTab&&shownTab!==tab?Math.sign(TABS.indexOf(tab)-TABS.indexOf(shownTab)):0;
  VIEWS[tab]();
  window.scrollTo(0,0);firstPaint=false;shownTab=tab;
  pageCache={};                       /* the data may have changed, so the spares are stale */
  (window.requestIdleCallback||(f=>setTimeout(f,120)))(warmPages);
  /* the tabs sit in a fixed order, so the page arrives from the side it lives on */
  if(dir&&!calm()&&!tabSwipe.busy){
    const a=view.animate([{transform:`translateX(${-dir*30}px)`,opacity:0},{transform:'none',opacity:1}],
      {duration:300,easing:'cubic-bezier(.32,.72,0,1)'});
    view.style.willChange='transform,opacity';moving(true);
    const done=()=>{view.style.willChange='';if(!TICK.live.size)moving(false)};
    a.finished.then(done,done);
  }
  syncTop();
}

/* a heading that folds the block under it away. the panel carries the id the heading names,
   so wiring is the same wherever it is used. */
const foldHead=(id,title,extra='',open=false)=>
  `<button class="foldh" aria-expanded="${open}" aria-controls="${id}"><h2>${title}${extra}</h2><svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M7.5 1.5l-6 6 6 6"/></svg></button>`;
function wireFolds(root,onToggle){
  (root||document).querySelectorAll('.foldh').forEach(hd=>{
    const panel=document.getElementById(hd.getAttribute('aria-controls'));
    if(!panel)return;
    hd.onclick=()=>{
      const open=hd.getAttribute('aria-expanded')==='true';
      hd.setAttribute('aria-expanded',String(!open));
      panel.hidden=open;
      if(onToggle)onToggle(panel.id,!open);
      if(!open&&!calm())panel.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],
        {duration:200,easing:'cubic-bezier(.32,.72,0,1)'});

}

function openForm(date,pre){
  if(PRIV()){toast('מצב פרטי מופעל — אין עריכה');return}
  const U=sorted();const editing=date?U.find(u=>u.date===date):null;const base=editing||U[U.length-1];
  const f={date:editing?editing.date:(pre&&pre.date||today()),rate:editing?editing.rate:'',vals:{}};
  for(const k of FIELDS)f.vals[k]=base?base.vals[k]:'';
  if(pre&&pre.vals)for(const k in pre.vals)f.vals[k]=pre.vals[k];
  let h=`<div class="sheet modal" role="dialog" aria-label="עדכון"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>${editing?'עריכת עדכון':'עדכון חדש'}</h2><span></span></header><div class="body"><form id="frm" novalidate>
  <div class="err" id="ferr" hidden role="alert"></div>
  <div class="grp"><div class="fld"><label for="f-date">תאריך העדכון</label><input id="f-date" type="date" value="${f.date}" required></div></div>`;
  if(!editing&&base)h+=`<p class="hint" style="padding-top:10px">השדות מולאו מהעדכון הקודם (<span class="n">${dlong(base.date)}</span>). שנו רק את מה שהשתנה.</p>`;
  const rateAcc=(ACCOUNTS.find(a=>a.cur==='USD')||{}).id;
  for(const a of ACCOUNTS){
    h+=`<div class="grp" style="--c:${acol(a.color)}"><h3>${esc(a.name)}${a.cur==='USD'?'<small>בדולרים</small>':'<small>בש״ח</small>'}</h3>`;
    for(const [k,nm] of a.fields)h+=`<div class="fld"><label for="f-${k}">${esc(nm)}</label><input id="f-${k}" data-k="${k}" inputmode="decimal" autocomplete="off" value="${f.vals[k]===''?'':f.vals[k]}" placeholder="0"></div>`;
    if(a.id===rateAcc)h+=`<div class="fld"><label for="f-rate">שער דולר<small>USD/ILS ביום העדכון</small></label><div class="inl"><input id="f-rate" inputmode="decimal" autocomplete="off" value="${f.rate||''}" placeholder="3.160"><button type="button" id="getrate">רענון</button></div></div><p class="hint" id="ratehint">השער נמשך לבד לפי התאריך. שער נוכחי: <b id="liverate2" class="n">—</b></p>`;
    if(S.plink[a.id])h+=`<input type="file" id="af-${a.id}" accept=".xlsx,.csv,.txt" hidden><div class="fld"><label for="af-${a.id}">קובץ אחזקות<small>לא חובה</small></label><div class="inl"><label class="atbtn" for="af-${a.id}" id="al-${a.id}">צירוף קובץ</label></div></div>`;
    h+=`</div>`}
  if(editing)h+=`<section><button type="button" class="btn danger" id="del">מחיקת העדכון</button></section>`;
  h+=`</form></div><footer><div class="sum"><small>סה״כ הון בעדכון הזה</small><b id="fsum">—</b></div><button class="btn" id="fsave">שמירה</button></footer></div>`;
  openLayer(h);
  const read=()=>{const u={date:$('#f-date').value,rate:$('#f-rate')?num($('#f-rate').value):0,vals:{}};layer.querySelectorAll('input[data-k]').forEach(i=>u.vals[i.dataset.k]=num(i.value));return u};
  const upd=()=>roll($('#fsum'),'fsum',calc(read()).total,ILSROLL,{stagger:0,response:.34});
  rollMem.fsum=undefined;upd();
  layer.querySelector('#frm').addEventListener('input',upd);
  showLiveRate('#liverate2');
  let rateTouched=!!f.rate;
  const rateInput=$('#f-rate');
  if(rateInput)rateInput.addEventListener('input',()=>{rateTouched=true});
  const pullRate=async force=>{
    const d=$('#f-date').value,hint=$('#ratehint');if(!rateInput||!d)return;
    if(rateTouched&&!force)return;
    hint.innerHTML='מושך שער…';
    try{const r=await fetchRate(d);rateInput.value=String(Math.round(r.rate*1e4)/1e4);rateTouched=false;
      hint.innerHTML=`שער ${esc(r.src)} ל-<span class="n">${dlong(r.date||d)}</span> · שער נוכחי: <b id="liverate2" class="n">—</b>`;upd()}
    catch(e){hint.innerHTML='לא הצלחתי למשוך שער. הקלידו אותו ידנית · שער נוכחי: <b id="liverate2" class="n">—</b>'}
    showLiveRate('#liverate2');
  };
  if($('#getrate'))$('#getrate').onclick=()=>pullRate(true);
  const dateEl=$('#f-date');
  if(dateEl)dateEl.addEventListener('change',()=>pullRate(false));
  if(rateInput&&!f.rate)pullRate(false);
  const attach={};                                  // optional holdings file, per account that has a portfolio
  for(const a of ACCOUNTS){
    const inp=$('#af-'+a.id);if(!inp)continue;
    inp.onchange=async e=>{
      const file=e.target.files[0];inp.value='';if(!file)return;
      const lab=$('#al-'+a.id);lab.textContent='קורא…';
      try{
        const hold=parsePortfolio(await readSheet(file));
        attach[a.id]=hold;
        const tot=summarize(hold).total,fld=S.plink[a.id];
        if(fld&&$('#f-'+fld)){$('#f-'+fld).value=Math.round(tot);upd()}
        lab.textContent=hold.length+' אחזקות · '+ils(tot);lab.classList.add('on');
      }catch(err){lab.textContent='צירוף קובץ';toast(err.message||'לא הצלחתי לקרוא את הקובץ')}
    };
  }
  $('#fsave').onclick=async()=>{const u=read(),err=$('#ferr');let msg='';
    const usdSum=ACCOUNTS.filter(a=>a.cur==='USD').flatMap(a=>a.fields).reduce((s,[k])=>s+u.vals[k],0);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(u.date))msg='בחרו תאריך לעדכון.';
    else if(S.updates.some(x=>x.date===u.date&&(!editing||x.date!==editing.date)))msg='כבר קיים עדכון בתאריך הזה. בחרו תאריך אחר או ערכו את הקיים.';
    else if(usdSum!==0&&!(u.rate>=2&&u.rate<=6))msg='יש יתרה בדולרים, אז צריך שער דולר בין 2 ל-6.';
    else if(layer.querySelector('input[data-k]')&&[...layer.querySelectorAll('input[data-k]')].some(i=>i.value.trim()!==''&&!/^-?[\d,]*\.?\d*$/.test(i.value.trim())))msg='באחד השדות יש ערך שאינו מספר.';
    if(msg){err.textContent=msg;err.hidden=false;layer.querySelector('.body').scrollTo({top:0,behavior:'smooth'});return}
    if(editing)S.updates=S.updates.filter(x=>x.date!==editing.date);
    S.updates.push(u);for(const id in attach)addSnapshot(id,u.date,attach[id]);closeLayer();tab='home';render();save();toast(Object.keys(attach).length?'העדכון והאחזקות נשמרו':'העדכון נשמר')};
  if(editing)$('#del').onclick=async()=>{if(!confirm('למחוק את העדכון מ-'+dlong(editing.date)+'?'))return;S.updates=S.updates.filter(x=>x.date!==editing.date);closeLayer();render();save();toast('העדכון נמחק')};
}
let liveRate=null,liveAt=0;
async function showLiveRate(sel){
  if(offscreen)return;
  const el=$(sel);if(!el)return;
  if(liveRate&&Date.now()-liveAt<3600000){el.textContent='₪'+liveRate.toFixed(3);el.classList.remove('flat');return}
  el.textContent='…';
  try{const r=await fetchRate(today());liveRate=r.rate;liveAt=Date.now();
    const e2=$(sel);if(e2){e2.textContent='₪'+r.rate.toFixed(3);e2.classList.remove('flat')}}
  catch(e){const e2=$(sel);if(e2)e2.textContent='לא זמין'}
}
function findRate(j){let found=null;(function walk(o,key){if(found!==null||o==null)return;if(typeof o==='number'){if(o>=2&&o<=6&&(/rate|ils|value/i.test(key||'')))found=o;return}if(typeof o==='object')for(const k in o)walk(o[k],k)})(j,'');return found}
async function fetchRate(d){
  const srcs=[[`https://api.frankfurter.dev/v2/rate/usd/ils?date=${d}&providers=boi`,'יציג (בנק ישראל)'],[`https://api.frankfurter.dev/v1/${d}?base=USD&symbols=ILS`,'אירופי (ECB)']];
  for(const [url,src] of srcs){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),7000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(t);if(!r.ok)continue;const j=await r.json();const rate=findRate(j);
    if(rate)return {rate,src,date:(Array.isArray(j)?j[0]&&j[0].date:j.date)||d}}catch(e){}}
  throw new Error('no rate');
}

function viewCompare(){
  const U=sorted();let h=`<div class="pagehead"><h1>השוואה</h1><p>שני תאריכים, זה מול זה</p></div>`;

  const st=viewCompare.st||(viewCompare.st={});if(!U.some(u=>u.date===st.a))st.a=U[U.length-2].date;if(!U.some(u=>u.date===st.b))st.b=U[U.length-1].date;

    const d=sb-sa;return t+`<tr class="tot"><td>סה״כ</td><td class="n">${compact(sa)}</td><td class="n">${compact(sb)}</td><td class="d"><span class="n ${cls(d)}">${arrow(d)} ${magIls(d)}</span><small class="n ${cls(d)}">${sa?pct(d/sa,2):''}</small></td></tr></tbody></table></div></section>`};
  h+=tbl('לפי חשבון',visAcc().map(a=>[esc(a.short),ca.acc[a.id],cb.acc[a.id],acol(a.color)]));
  h+=`<section><div class="panel facts"><div><small>ימים בין התאריכים</small><b>${Math.round((new Date(B.date)-new Date(A.date))/864e5)}</b></div><div><small>שער דולר</small><b>${A.rate?A.rate.toFixed(3):'—'} → ${B.rate?B.rate.toFixed(3):'—'}</b></div></div></section>`;

  if(offscreen)return;
  $('#ca').onchange=e=>{st.a=e.target.value;viewCompare()};$('#cb').onchange=e=>{st.b=e.target.value;viewCompare()};
}

/* ---------- the account book ----------
   accounts are not in the code: they are built here, on the device, and travel only in the backup.
   anyone can set the app up from scratch: add an account, tick what it holds, and say whether it
   takes a bank file or is filled in by hand. */
const PARTS=[['עו״ש','cur'],['מט״ח','fx'],['ניירות ערך','cap'],['פקדונות','sav'],['קרנות','cap']];
const PALETTE=['#8A2D0C','#E0A008','#E2571C','#2F9E6E','#3B82F6','#6D4AC4','#C2255C','#44566A'];
const fresh=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);

/* a working copy of one account: the standard components, plus anything it already holds that
   is not one of them, so editing an existing account never drops a field by surprise */
function accDraft(a){
  const used=new Set();
  const rows=PARTS.map(([lbl,t])=>{
    const f=(a?a.fields:[]).find(x=>x[1]===lbl&&!used.has(x[0]));
    if(f)used.add(f[0]);
    return {key:f?f[0]:fresh('f'),label:lbl,type:t,on:!!f,trend:f?!!f[3]:false,std:true};
  });
  for(const f of (a?a.fields:[]))if(!used.has(f[0]))rows.push({key:f[0],label:f[1],type:f[2],on:true,trend:!!f[3],std:false});
  return {id:a?a.id:fresh('a'),name:a?a.name:'',short:a?a.short:'',cur:a?a.cur:'ILS',
    color:a?a.color:PALETTE[ACCOUNTS.length%PALETTE.length],rows,link:a?(S.plink[a.id]||''):'',focus:''};
}

  <span class="val"><button class="sw" data-row="${i}" role="switch" aria-checked="${r.on}" aria-label="${esc(r.label)||'רכיב'}"><i></i></button></span></div>`).join('')}
  <button class="row plain" id="ac-other"><span><span class="nm" style="color:var(--tink)">אחר</span></span><span class="val" style="color:var(--tink);font-size:22px;line-height:1">+</span></button>
  </div><p class="hint">כל רכיב מסומן הופך לשדה בעדכון ולשורה בפירוט היתרות. ״אחר״ מוסיף רכיב בשם שתכתבו.</p></section>
  <section><h2>קובץ מהבנק</h2><div class="panel">

  </div><p class="hint">כשזה מופעל מופיע בדף החשבון ״תיק ניירות ערך״, ובעדכון חדש אפשר לצרף את קובץ האחזקות שהבנק מייצא. גם אז אפשר תמיד להזין ידנית.</p></section>
  ${editing?`<section><button type="button" class="btn danger" id="ac-del">מחיקת החשבון</button></section>`:''}

function openAccEditor(id){
  if(PRIV()){toast('מצב פרטי מופעל');return}
  const a=id?ACCOUNTS.find(x=>x.id===id):null;
  if(id&&!a)return;
  const d=accDraft(a);
  openLayer(`<div class="sheet modal" role="dialog" aria-label="חשבון"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>${a?'עריכת חשבון':'חשבון חדש'}</h2><span></span></header><div class="body"></div></div>`);
  const L=stack[stack.length-1];
  const paint=()=>{const b=L.el.querySelector('.body');const y=b.scrollTop;b.innerHTML=accBody(d,!!a);b.scrollTop=y;wire();
    if(d.focus){const i=d.rows.findIndex(r=>r.key===d.focus),el=i<0?null:L.el.querySelector(`[data-lbl="${i}"]`);
      d.focus='';if(el){el.scrollIntoView({block:'center'});el.focus()}}};
  const grab=()=>{const n=L.el.querySelector('#ac-name'),h=L.el.querySelector('#ac-short'),l=L.el.querySelector('#ac-link');
    if(n)d.name=n.value;if(h)d.short=h.value;if(l)d.link=l.value;
    L.el.querySelectorAll('[data-lbl]').forEach(i=>{d.rows[+i.dataset.lbl].label=i.value});};
  function wire(){
    L.el.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>{grab();d.cur=b.dataset.cur;paint()});
    L.el.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{grab();d.color=b.dataset.color;paint()});
    L.el.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{grab();const r=d.rows[+b.dataset.row];r.on=!r.on;if(!r.on&&d.link===r.key)d.link='';paint()});
    const lk=L.el.querySelector('[data-link]');
    if(lk)lk.onclick=()=>{grab();
      if(d.link){d.link=''}
      else{const on=d.rows.filter(r=>r.on);if(!on.length){toast('בחרו קודם מה יש בחשבון');return}
        d.link=(on.find(r=>r.type==='cap')||on[0]).key}
      paint()};
    L.el.querySelector('#ac-other').onclick=()=>{grab();
      const r={key:fresh('f'),label:'',type:'cap',on:true,trend:false,std:false};
      d.rows.push(r);d.focus=r.key;paint()};
    const sel=L.el.querySelector('#ac-link');if(sel)sel.onchange=()=>{d.link=sel.value};
    const del=L.el.querySelector('#ac-del');
    if(del)del.onclick=async()=>{
      if(!confirm('למחוק את החשבון? הסכומים שהוזנו עבורו יימחקו מכל העדכונים.'))return;
      delete S.ports[a.id];delete S.plink[a.id];delete S.pmask[a.id];
      setConfig(ACCOUNTS.filter(x=>x.id!==a.id));S.updates=clean(S.updates);
      closeLayer();setTimeout(render,340);save();toast('החשבון נמחק');
    };
    L.el.querySelector('#ac-save').onclick=async()=>{

/* ---------- a holding's own price history ----------
   every bank file carries the closing price of each security, so each upload leaves one point
   behind. no outside source, no key, nothing sent anywhere: the resolution is simply the rate at
   which files are uploaded. shekel-quoted securities are priced in agorot, as the bank quotes them. */
function priceSeries(accId,holdId,days){
  const from=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):'';
  const out=[];
  for(const snap of portsRaw(accId)){
    if(!snap.hold)continue;                      /* the oldest snapshots keep only their totals */
    if(from&&snap.date<from)continue;
    const h=snap.hold.find(y=>String(y.id)===String(holdId));
    if(h&&h.price>0)out.push({d:snap.date,v:h.price});
  }
  return out;
}
/* ---------- a year of daily closes, for the securities a free source covers ----------
   Twelve Data's free plan is US listings only, so this reaches the shares and the ETFs quoted in
   dollars and nothing else; everything else keeps the chart built from the uploaded files above.
   The series is held in memory for the session and never written to the stored blob: it is market
   data, it is one request to get back, and 250 points per security would bloat every save. */

async function fetchPx(sym){
  if(!S.td)throw new Error('no-key');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch('https://api.twelvedata.com/time_series?interval=1day&outputsize=1300&symbol='+
      encodeURIComponent(sym)+'&apikey='+encodeURIComponent(S.td),{signal:ctl.signal});
    const j=await r.json();
    if(j.code===401||j.code===403)throw new Error('key');
    if(j.code===429)throw new Error('rate');
    if(!Array.isArray(j.values)||!j.values.length)throw new Error('empty');
    const pts=j.values.map(v=>({d:String(v.datetime).slice(0,10),v:parseFloat(v.close)}))
      .filter(v=>Number.isFinite(v.v)).reverse();                 /* the API returns newest first */
    if(pts.length<2)throw new Error('empty');

  }finally{clearTimeout(t)}
}

  const xs=hit.dataset.xs.split(',').map(Number);

/* no axes, no grid, no markers — just the line, its baseline and a fill under it */
function pxChart(pts,col,label){

  if(hi===lo){hi+=Math.abs(hi)*0.01||1;lo-=Math.abs(lo)*0.01||1}
  const x=i=>pts.length<2?W/2:i*W/(pts.length-1);
  const y=v=>PADY+(hi-v)*(H-PADY*2)/(hi-lo);
  const pt=pts.map((p,i)=>x(i).toFixed(2)+','+y(p.v).toFixed(2)).join(' ');
  const base=y(pts[0].v).toFixed(2);

  return `<svg class="pxchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">

    <rect class="pxhit" x="0" y="0" width="${W}" height="${H}" fill="transparent"

}

   funds have no analyst coverage at all. The key lives in the encrypted store on this device,

const RECDAY=20*60*60*1000;                       /* a consensus does not move hourly */

   so nothing needs typing. Anything else in that column is not one: bonds arrive as
   "BA 2.7 2/2" and non-US listings as "VITB SS" (Stockholm) or "CSU CN" (Toronto), and the free
   sources cover US listings only — so those are left for the user to fill in or leave empty. */

  const s=String((x&&x.sym)||'').toUpperCase().replace(/[^A-Z0-9./\- ]/g,'').trim();
  if(!/^[A-Z][A-Z0-9]{0,4}([./][A-Z])?$/.test(s))return '';

}
function recVerdict(r){
  const v=recScore(r);if(!v)return null;

  const KEYS=['1','2','3','4','5','6','7','8','9','','0','⌫'];

    el.innerHTML=`<span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
      <div class="in">

          Array.from({length:len},(_,i)=>`<i class="${i<code.length?'on':''}"></i>`).join('')}</div>
        <div class="msg" role="alert"></div>

      </div>`;

  };

  };

  const go=async pass=>{
    if(busy)return;busy=true;
    el.querySelectorAll('.pad button').forEach(b=>b.disabled=true);
    try{await unlock(pass);done()}
    catch(err){fail('הקוד שגוי. נסו שוב.')}
  };
  const wire=()=>{
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      if(busy)return;
      const k=b.dataset.k;
      if(k==='⌫'){code=code.slice(0,-1);paint();return}
      if(code.length>=len)return;

    });
  };

}

/* ---------- reading a spreadsheet: .xlsx unzipped by the browser itself, or .csv ---------- */
const TD=new TextDecoder();
async function inflateRaw(bytes){
  if(!('DecompressionStream' in window))throw new Error('הדפדפן הזה לא יודע לפתוח קובץ Excel. ייצאו את הקובץ כ-CSV.');
  const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),out={};
  let eo=-1;
  for(let i=u.length-22;i>=0&&i>u.length-66000;i--)if(dv.getUint32(i,true)===0x06054b50){eo=i;break}
  if(eo<0)throw new Error('הקובץ אינו קובץ Excel תקין.');
  let n=dv.getUint16(eo+10,true),off=dv.getUint32(eo+16,true);
  for(let k=0;k<n&&off+46<=u.length;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true),name=TD.decode(u.subarray(off+46,off+46+nl));
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    out[name]={method,data:u.subarray(start,start+csize)};
    off+=46+nl+el+cl;
  }
  return out;
}
async function zipText(z,name){const e=z[name];if(!e)return null;return TD.decode(e.method===0?e.data:await inflateRaw(e.data))}
const colOf=ref=>{let n=0;for(const ch of ref){const c=ch.charCodeAt(0);if(c<65||c>90)break;n=n*26+(c-64)}return n-1};
function parseCsv(txt){
  const rows=[];let row=[],f='',q=false;
  txt=txt.replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(v=>{const t=v.trim();if(t==='')return null;const n=+t.replace(/,/g,'');return Number.isFinite(n)&&/^[-+]?[\d,]*\.?\d+$/.test(t)?n:t}));
}
async function readSheet(file){
  if(/\.(csv|txt|tsv)$/i.test(file.name))return parseCsv(await file.text());
  const z=await unzip(await file.arrayBuffer());
  let target='xl/worksheets/sheet1.xml';
  try{
    const wb=new DOMParser().parseFromString(await zipText(z,'xl/workbook.xml'),'application/xml');
    const sh=wb.getElementsByTagName('sheet')[0];
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const rl=new DOMParser().parseFromString(await zipText(z,'xl/_rels/workbook.xml.rels'),'application/xml');
    for(const r of rl.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid){
      let t=r.getAttribute('Target');target=t.replace(/^\//,'').replace(/^\.\//,'');if(!target.startsWith('xl/'))target='xl/'+target;
    }
  }catch(e){}
  const ss=[],ssx=await zipText(z,'xl/sharedStrings.xml');
  if(ssx){const d=new DOMParser().parseFromString(ssx,'application/xml');
    for(const si of d.getElementsByTagName('si')){let s='';for(const t of si.getElementsByTagName('t'))s+=t.textContent;ss.push(s)}}
  const sx=await zipText(z,target);
  if(!sx)throw new Error('לא נמצא גיליון בקובץ.');
  const d=new DOMParser().parseFromString(sx,'application/xml'),rows=[];
  for(const row of d.getElementsByTagName('row')){
    const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const i=colOf(c.getAttribute('r')||''),t=c.getAttribute('t');let v=null;
      if(t==='inlineStr'){const e=c.getElementsByTagName('t')[0];v=e?e.textContent:''}
      else{const e=c.getElementsByTagName('v')[0];if(e){v=e.textContent;if(t==='s')v=ss[+v]??'';else if(t!=='str'&&t!=='e')v=+v}}
      if(i>=0)arr[i]=v;
    }
    rows.push(arr);
  }
  return rows;
}

/* ---------- turning those rows into holdings ---------- */
const PF={num:['מס.ניע','מס ניע','מספר נייר','מס נ"ע'],name:['שם ניע','שם נייר','שם נ"ע'],price:['שער אחרון','שער'],
  value:['שווי אחזקה','שווי בשח','שווי'],qty:['כמות'],cur:['מטבע'],valueCur:['שווי במטבע'],sym:['סימבול'],
  gain:['שינוי מרכישה'],taxGain:['רוון הון תיאורטי','רווח הון תיאורטי'],tax:['מס תיאורטי'],sub:['מס. משני','מס משני']};
const norm=s=>String(s??'').replace(/[‎‏‪-‮]/g,'').replace(/["'״׳]/g,'"').replace(/\s+/g,' ').trim();
function mapHeader(rows){
  for(let r=0;r<Math.min(rows.length,25);r++){
    const m={},seen={};
    (rows[r]||[]).forEach((cell,i)=>{
      const h=norm(cell);if(!h)return;
      for(const k in PF)if(!(k in m)&&PF[k].some(x=>norm(x)===h)){m[k]=i;seen[k]=1}
    });
    if(m.num!=null&&m.name!=null&&m.value!=null&&Object.keys(m).length>=5)return {row:r,map:m};
  }
  return null;
}
const ETFWORDS=/ISHARES|SHARES|SPDR|VANGUARD|INVESCO|FIRST TRUST|\bFT\b|ROUNDHILL|SELECT|\bSEL\b|\bTRUST\b|\bETF\b|INDEX|NASDAQ/i;
function guessType(h){
  const n=norm(h.name);
  /* a foreign bond's symbol carries its coupon ("BA 2.7 2/2"), which the mangled name does not
     always show; a share's symbol never looks like that */
  if(/^[A-Z.]+ \d+(\.\d+)?/.test(norm(h.sym)))return 'bond';
  if(/אג"ח|אגח|ממשל|ממשלתית|מלווה/.test(n))return 'bond';
  if(/\d+\.\d+\s*\d*\/?\d*$|\d+\.\d+\s/.test(n)&&!/[א-ת]/.test(n))return 'bond';
  if(/(?:^|[^א-ת])סל(?:[^א-ת]|$)|תעודת|מחקה|קרן סל|תכלית|קסם|פסגות סל|MTF|הראל סל/.test(n))return 'fund';
  if(ETFWORDS.test(n))return 'fund';
  return 'stock';
}
const TYPECOL={stock:'#3B82F6',bond:'#2F9E6E',fund:'#E2571C'};
function parsePortfolio(rows){
  const hit=mapHeader(rows);
  if(!hit)throw new Error('לא זיהיתי את הכותרות בקובץ. ודאו שזו שורת האחזקות המקורית מהבנק.');
  const m=hit.map,out=[];
  for(let r=hit.row+1;r<rows.length;r++){
    const row=rows[r]||[];const id=row[m.num];
    if(id==null||id==='')continue;
    const name=norm(row[m.name]);if(!name)continue;
    const v=num(row[m.value]);
    out.push({id:String(id),name,sym:m.sym!=null?norm(row[m.sym]):'',qty:num(row[m.qty]),price:num(row[m.price]),
      v,vc:m.valueCur!=null?num(row[m.valueCur]):v,cur:m.cur!=null?norm(row[m.cur])||'שקל':'שקל',
      gain:m.gain!=null?num(row[m.gain]):0,tg:m.taxGain!=null?num(row[m.taxGain]):0,tx:m.tax!=null?num(row[m.tax]):0});
  }
  if(!out.length)throw new Error('לא נמצאו אחזקות בקובץ.');
  return out;
}
const ptypeOf=h=>S.ptype[h.id]||guessType(h);
function summarize(hold){
  const s={total:0,cur:{},cat:{},count:{},gain:0,loss:0,tax:0,shield:0};
  for(const h of hold){
    s.total+=h.v;
    s.cur[h.cur]=(s.cur[h.cur]||0)+h.v;
    const c=catOf(h);s.cat[c]=(s.cat[c]||0)+h.v;s.count[c]=(s.count[c]||0)+1;
    if(h.tg>0)s.gain+=h.tg;else s.loss+=h.tg;
    if(h.tx>0)s.tax+=h.tx;else s.shield+=h.tx;
  }
  return s;
}
const portsRaw=id=>(S.ports[id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
/* what the portfolio pages read: the same snapshots, scaled when private mode asks for it,
   so a holdings list always adds up to the account figure shown beside it */
function portsOf(id){
  const list=portsRaw(id),q=facOf(id);
  if(q===1)return list;
  const sc=n=>typeof n==='number'?n*q:n;
  const scm=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[k,sc(v)]));
  return list.map(p=>({...p,
    hold:p.hold?p.hold.map(h=>({...h,qty:sc(h.qty),v:sc(h.v),vc:sc(h.vc),gain:sc(h.gain),tg:sc(h.tg),tx:sc(h.tx)})):p.hold,
    sum:p.sum?{...p.sum,total:sc(p.sum.total),gain:sc(p.sum.gain),loss:sc(p.sum.loss),tax:sc(p.sum.tax),shield:sc(p.sum.shield),
      cur:scm(p.sum.cur),cat:scm(p.sum.cat)}:p.sum}));
}
const KEEP_ROWS=24;
function addSnapshot(accId,date,hold){
  const list=(S.ports[accId]||[]).filter(p=>p.date!==date);
  list.push({date,hold});
  list.sort((a,b)=>a.date<b.date?-1:1);
  list.forEach((p,i)=>{if(i<list.length-KEEP_ROWS&&p.hold){p.sum=p.sum||summarize(p.hold);delete p.hold}});
