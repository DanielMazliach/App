<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מעקב כספים">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>מעקב כספים</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --ink2:#48484A; --muted:#6C6C70; --sep:#3C3C4329; --line:#E5E5EA; --fill:#7676801F;
  --up:#1F7A35; --down:#D70015; --tint:#007AFF; --focus:#007AFF; --ease:cubic-bezier(.32,.72,0,1);
  /* #007AFF is 4.0:1 on white — fine for an icon or a fill, short of the 4.5:1 a label needs.
     --tink is the blue for text, --btn the blue a filled button can carry white on. */
  --tink:#0A6BD4; --btn:#0A6BD4;
  --blur:saturate(1.6) blur(16px);
  --up2:#5BB974; --chev:#C7C7CC; --knob:#FFFFFF; --onTint:#FFFFFF; --bar:#F9F9F9D9; --barsheet:#F2F2F7CC; --grab:#C7C7CC;
  --press:#E8F0FE; --errbg:#FFE5E7; --errink:#A1000F; --toast:#3A3A3CF2; --ontoast:#FFFFFF;
  --cline:#1C1C1E; --cgrid:#E5E5EA; --cring:#FFFFFF; --ccross:#9AA8B4; --knobshadow:rgba(0,0,0,.16);
  --segbg:#7676801F; --segon:#FFFFFF; --segsh:0 1px 3px #0000001f;
  --ctext:#636366; --tabink:#5E5E63; --rowpress:#E5E5EA;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "SF Hebrew", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --txt: -apple-system, system-ui, "SF Hebrew", "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --ink2:#D1D1D6; --muted:#98989F;
    --sep:#54545899; --line:#38383A; --fill:#7676803D;
    --up:#30D158; --down:#FF453A; --tint:#0A84FF; --focus:#0A84FF;
    --tink:#0A84FF; --btn:#0A6BD4;
    --up2:#2B9E4E; --chev:#48484A; --knob:#FFFFFF; --onTint:#FFFFFF; --bar:#1C1C1ED9; --barsheet:#1C1C1ECC; --grab:#48484A;
    --press:#0A84FF2E; --errbg:#3A1216; --errink:#FF6A6A; --toast:#48484AF2; --ontoast:#FFFFFF;
    --cline:#F2F2F7; --cgrid:#2C2C2E; --cring:#1C1C1E; --ccross:#636366; --knobshadow:rgba(0,0,0,.5);
    --segbg:#1C1C1E; --segon:#636366; --segsh:none;
    --ctext:#98989F; --tabink:#98989F; --rowpress:#2C2C2E;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
/* -apple-system-body carries the reader's Dynamic Type size, so the root grows with it and
   every size below, written in rem, grows with it too. 17px is the default. */
html{font:-apple-system-body;font-family:var(--txt)}
@supports not (font:-apple-system-body){html{font-size:1rem}}
body{font-family:var(--txt);color:var(--ink);font-size:1rem;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
[hidden]{display:none!important}

#app{min-height:100%;background:var(--bg);padding-bottom:calc(76px + var(--sab))}
.view{max-width:560px;margin:0 auto}

/* overview header: the total is the title */
.hero{padding:calc(var(--sat) + 20px) 16px 0}
.hero h1{margin:0 4px;font-size:0.8824rem;font-weight:600;color:var(--muted)}
.hero .total{font-family:var(--num);font-size:min(2.7059rem,12.6vw);font-weight:700;letter-spacing:-.024em;line-height:1.08;margin:2px 4px 0;direction:ltr;text-align:right}
.hero .asof{font-size:0.8824rem;color:var(--muted);margin:2px 4px 0}
.hero .deltas{display:flex;gap:10px;margin:18px 0 10px}
.hero .deltas div,.chips div{flex:1;min-width:0;background:var(--surface);border-radius:14px;padding:11px 12px}
.hero .deltas div>b,.chips div>b{margin-inline-end:4px}
/* the figure and its percentage read as one statement: one line at the usual text size, and
   only at a larger one does the percentage drop below rather than spill out of the card */
.hero .deltas div>b,.chips div>b,.hero .deltas div>span,.chips div>span{white-space:nowrap}
.hero .deltas small,.chips small{display:block;font-size:0.7647rem;color:var(--muted)}
.hero .deltas b,.chips b{font-family:var(--num);font-weight:600;direction:ltr;display:inline-block;
  font-size:min(1.1176rem,4.1vw)}        /* sized to share one line with its percentage on any phone width */
.hero .deltas span,.chips span{font-size:min(0.7647rem,3.1vw)}
.readout{font-size:0.7647rem;min-height:18px;color:var(--muted);margin:4px 0 0;text-align:center}

.pagehead{padding:calc(var(--sat) + 20px) 20px 2px}
.pagehead h1{margin:0;font-size:2rem;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.pagehead p{margin:2px 0 0;font-size:0.8824rem;color:var(--muted)}

section{margin:28px 16px 0}
section>h2{font-size:1.2941rem;font-weight:700;letter-spacing:-.016em;line-height:1.2;margin:0 4px 10px}
section>h2 small,.foldh h2 small{font-weight:400;font-size:0.8824rem;letter-spacing:0;color:var(--muted);margin-inline-start:6px}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.foldh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:0;border:0;padding:0;margin:0 4px 6px;
  font:inherit;color:inherit;text-align:start;-webkit-tap-highlight-color:transparent}
.foldh h2{font-size:1.2941rem;font-weight:700;letter-spacing:-.016em;line-height:1.2;margin:0}
.foldh .chev{width:9px;height:15px;flex:0 0 auto;fill:none;stroke:var(--tink);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;transform:rotate(-90deg);transition:transform .22s var(--ease)}
.foldh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.foldh:active h2{opacity:.5}
@media(prefers-reduced-motion:reduce){.foldh .chev{transition:none}}
.pad{padding:14px 16px}

.stack{display:flex;gap:3px;height:12px;direction:rtl;margin:2px 0;border-radius:6px}
.pcard{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--surface);padding:16px;box-sizing:border-box;text-align:start;color:var(--ink);font:inherit}
.pcard:active{background:var(--line)}
.pcard>span{display:block}
.pc-top{display:flex!important;align-items:center;justify-content:space-between;gap:10px}
.pc-nm{font-weight:600}
.pc-cnt{display:flex;align-items:center;gap:8px;font-size:0.7647rem;color:var(--muted)}
.pcard .chev{width:8px;height:14px;fill:none;stroke:var(--chev);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pc-val{display:flex!important;align-items:baseline;gap:10px;margin-top:6px}
.pc-val b{font-size:1.6471rem;font-weight:700;letter-spacing:-.02em}
.pc-val>span{font-size:0.8235rem;font-weight:600}
.pcard .stack{margin:14px 0 0}
.pc-leg{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:12px}
.pc-leg>span{display:flex;align-items:center;gap:7px;font-size:0.7647rem;color:var(--ink2);min-width:0}
.pc-leg i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pc-leg b{margin-inline-start:auto;color:var(--ink);font-weight:600}
.pc-hint{margin-top:8px;font-size:0.7647rem;color:var(--tink);font-weight:600}
.stack i{display:block;height:100%;min-width:8px;border-radius:6px}

/* list rows: separators only, inset from the leading edge */
.row{position:relative;display:grid;grid-template-columns:10px 1fr auto;gap:0 12px;align-items:center;width:100%;min-height:max(60px,3.5rem);text-align:start;padding:10px 16px;background:var(--surface);transition:background .07s ease-out}
.row::before,.facts div::before{content:"";position:absolute;top:0;inset-inline:38px 0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row:first-child::before,.facts div:first-child::before{display:none}
.row .spine{width:10px;height:10px;border-radius:50%}
/* a name that wraps makes the row 82px while its neighbours are 64px, and the column stops
   reading as a column. one line, ellipsis; the full name is on the holding's own page. */
.row .nm{font-weight:400;font-size:1rem;display:block;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>span:nth-child(2){min-width:0}
.row .sub{font-size:0.7647rem;color:var(--muted);margin-top:1px}
.row .val{text-align:left}
.row .val b{font-family:var(--num);font-size:1rem;font-weight:600;display:block;direction:ltr}
.row .val span{font-size:0.7647rem}
button.row{grid-template-columns:10px 1fr auto 8px}
button.row:active{background:var(--rowpress)}
.row .chev{width:8px;height:14px;fill:none;stroke:var(--chev);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);border:0;padding:0;position:relative;flex:0 0 auto;transition:background .28s cubic-bezier(.32,.72,0,1);-webkit-tap-highlight-color:transparent}
.sw[aria-checked="true"]{background:var(--up)}
.sw i{position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 6px var(--knobshadow),0 0 0 .5px rgba(0,0,0,.04);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sw[aria-checked="true"] i{transform:translateX(-20px)}
.sw:active i{width:29px}
.pmk{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;opacity:.4;vertical-align:-1px}
.rec{display:inline-flex;align-items:center;font-size:0.7647rem;font-weight:600;padding:1px 7px;border-radius:7px;line-height:1.5}
.rec.buy{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.rec.hold{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--ink2)}
.rec.sell{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.rec.none{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);font-weight:500}
.recwait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:0.7647rem}
.recwait .ring{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--muted);animation:ringspin .75s linear infinite;flex:0 0 auto}
.bigrec{font-size:1.5294rem;font-weight:700;letter-spacing:-.02em;margin:1px 0 2px}
.bigrec.buy{color:var(--up)}.bigrec.sell{color:var(--down)}
.cons{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 12px}
.cons i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:0.7647rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.swatches{display:flex;gap:8px;justify-content:space-between}
.sw-c{width:36px;height:36px;border-radius:50%;border:0;padding:0;position:relative;-webkit-tap-highlight-color:transparent}
.sw-c::before{content:"";position:absolute;inset:-4px;border-radius:50%}  /* 44×44 to the finger */
.sw-c[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--ink)}
.pick1{min-height:44px;border:0;background:transparent;color:var(--tink);font-size:1rem;text-align:start}
.row .lblin{width:100%;border:0;background:transparent;font:inherit;font-size:1rem;color:var(--ink);padding:3px 0;border-radius:6px;transition:background .15s}
.row .lblin:focus{background:var(--bg);outline:0;padding:3px 7px;margin:0 -7px}
.row .lblin::placeholder{color:var(--chev)}
@media(prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}
.sheet .row{grid-template-columns:1fr auto;min-height:52px}
.row.plain{grid-template-columns:1fr auto}
button.row.plain{grid-template-columns:1fr auto 8px}
.row.plain::before{inset-inline:16px 0}
.sheet .row .spine{display:none}
.sheet .row.dotted{grid-template-columns:10px 1fr auto}
.sheet button.row.dotted{grid-template-columns:10px 1fr auto 8px}
.sheet .row.dotted .spine{display:block}
.sheet .row.ind{padding-inline-start:34px;min-height:44px}
.sheet .row.ind::before{inset-inline-start:34px}
/* a row inside a sheet that leads somewhere needs a track for its chevron, or the chevron
   wraps onto a line of its own */
.sheet button.row{grid-template-columns:1fr auto 8px}
.sheet button.row.dotted{grid-template-columns:10px 1fr auto 8px}
.sheet .row::before{inset-inline-start:16px}

.facts div{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:10px 16px;background:var(--surface)}
.facts div::before{inset-inline-start:16px}
.facts small{font-size:1rem;color:var(--ink)}
.facts b{font-family:var(--num);font-size:1rem;font-weight:400;color:var(--muted);direction:ltr}
.facts b.up{color:var(--up)}.facts b.down{color:var(--down)}
.row.link .nm{color:var(--tink);font-weight:500}
.row.link .chev{stroke:var(--tink);stroke-width:2.4}

.note{font-size:0.8824rem;color:var(--ink2);background:var(--surface);border-radius:14px;padding:12px 16px;margin:18px 16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.note button{color:var(--tink);font-weight:600;white-space:nowrap;min-height:44px;padding-inline:4px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--btn);color:var(--onTint);font-weight:600;font-size:1rem;padding:0 18px;transition:opacity .09s ease-out,transform .09s ease-out}
.btn.ghost{background:var(--fill);color:var(--tink)}
.btn.danger{background:var(--fill);color:var(--down)}
.btn:active{opacity:.7;transform:scale(.985)}
.btn[disabled]{opacity:.4}
.stackbtns{display:grid;gap:10px}

.tabbar{position:fixed;inset:auto 0 0 0;background:var(--bar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 -.5px 0 var(--sep);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
.tabbar div{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;min-height:52px;padding:4px 2px;font-size:0.6471rem;font-weight:500;color:var(--tabink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--tink)}

/* pages: a detail page pushes in from the side, a form rises as a sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;touch-action:pan-y;will-change:transform}
.sheet header{position:relative;background:var(--barsheet);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 .5px 0 transparent;transition:box-shadow .2s;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(var(--sat) + 4px) 10px 4px;min-height:calc(var(--sat) + 48px)}
.sheet header.edge{box-shadow:0 .5px 0 var(--sep)}
.sheet header h2{margin:0;font-size:1rem;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet header button{color:var(--tink);font-size:1rem;min-height:44px;padding:0 6px;justify-self:start;display:flex;align-items:center;gap:3px}
.sheet header button:active{opacity:.4}
.sheet header button svg{width:12px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--sab))}
.sheet footer{background:var(--bar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 -.5px 0 var(--sep);padding:10px 16px calc(10px + var(--sab));display:flex;align-items:center;gap:14px}
.sheet footer .sum{flex:1;min-width:0}
.sheet footer .sum small{display:block;color:var(--muted);font-size:0.7647rem}
.sheet footer .sum b{font-family:var(--num);font-size:1.2941rem;font-weight:600;letter-spacing:-.01em;direction:ltr;display:inline-block}
.sheet footer .btn{width:auto;min-width:120px}
.sheet.modal{top:calc(var(--sat) + 10px);border-radius:12px 12px 0 0;overflow:hidden}
.sheet.modal header{touch-action:none;padding-top:14px;min-height:58px}
.grab{position:absolute;top:6px;left:0;right:0;height:5px;margin:0 auto;width:36px;border-radius:3px;background:var(--grab)}
.scrim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
.segbar{display:flex;gap:2px;background:var(--segbg);border-radius:9px;padding:2px;margin:0 4px 10px}
.segbar button{position:relative;flex:1;min-height:36px;border-radius:7px;font-size:0.7647rem;font-weight:500;color:var(--ink)}
.segbar button::before{content:"";position:absolute;inset:-4px 0;pointer-events:auto}
.segbar button[aria-selected="true"]{background:var(--segon);font-weight:600;box-shadow:var(--segsh)}
.chiprow{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(to left,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  scroll-padding-inline:16px;display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
/* every option is laid out in full, so nothing is hidden off the edge */
.chipwrap{margin:0 4px 10px;display:grid;gap:8px}
.chipwrap button{min-height:40px;padding:0 12px;border-radius:20px;background:var(--fill);font-weight:500;
  font-size:clamp(0.72rem,3.3vw,0.8235rem);color:var(--ink);display:flex;align-items:center;justify-content:center;
  gap:6px;min-width:0;overflow:hidden}
.chipwrap button .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chipwrap button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chipwrap .spine{width:8px;height:8px;border-radius:50%;flex:none}
.chipall button{width:100%;min-height:46px;font-size:0.9412rem;font-weight:600}
.chipgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.chipadd{display:flex;flex-wrap:wrap;gap:8px}
.chipadd button{flex:1 1 auto;background:none;color:var(--tink);font-weight:600;min-height:40px}
.chiprow button{flex:none;min-height:40px;padding:0 15px;border-radius:20px;background:var(--fill);font-size:0.8235rem;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chiprow button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chiprow .spine{width:8px;height:8px;border-radius:50%;flex:none}
.chiprow .spine.hollow{box-shadow:inset 0 0 0 2.5px var(--c)}
.row .spine.hollow,.chiprow .spine.hollow{background:var(--surface)!important;box-shadow:inset 0 0 0 3px var(--c)}
.chiprow button[aria-pressed="true"] .spine.hollow{background:var(--ink)!important}
button.row[aria-pressed="true"]{background:var(--press)}
button.row[aria-pressed="true"] .nm{font-weight:600}
#app,#tabbar{will-change:transform}

.acc-head{padding:6px 20px 0}
.acc-head h1{margin:0;font-size:2rem;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.acc-head h1 span{font-size:.5em;vertical-align:middle}
.acc-head .big{font-family:var(--num);font-size:min(2rem,9.6vw);font-weight:600;letter-spacing:-.02em;direction:ltr;text-align:right;margin-top:14px;line-height:1.1}
.acc-head .meta{color:var(--muted);font-size:0.8824rem;margin-top:2px}
.chips{display:flex;gap:10px;margin:18px 16px 0}

/* forms: grouped rows, borderless fields */
.grp{margin:22px 16px 0;background:var(--surface);border-radius:14px;overflow:hidden}
.grp h3{margin:0;padding:12px 16px 2px;font-size:0.7647rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}

  opacity:0;pointer-events:none;color:var(--muted);font-size:0.7647rem}

  backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

@media (prefers-reduced-transparency:reduce){

}

}
@media (prefers-reduced-motion:no-preference){
  svg .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s var(--ease) forwards}

  @keyframes toastin{from{opacity:0;transform:translateY(8px)}}
}

<div id="topbar" aria-hidden="true"><span></span></div>
<div id="app"><div class="view" id="view"></div></div>
<div id="scrim" aria-hidden="true"></div>
<nav class="tabbar" id="tabbar" hidden><div>
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>סקירה</button>
  <button data-tab="updates"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>עדכונים</button>
  <button data-tab="compare"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>השוואה</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>הגדרות</button>
</div></nav>
<div id="layer"></div>
<script>
'use strict';
/* ---------- model ---------- */
/* accounts are not part of the code: they arrive with the backup file and live only on the device */
let ACCOUNTS=[],FIELDS=[];
const cleanFields=l=>(Array.isArray(l)?l:[]).filter(f=>Array.isArray(f)&&SAFEID.test(String(f[0]))).map(f=>[String(f[0]),String(f[1]||f[0]),['cur','fx','cap','sav'].includes(f[2])?f[2]:'cap',!!f[3]]);
/* ids and keys become attribute values and object keys all over the page, so a backup may only
   use the shape the app itself makes: letters, digits, _ and -. anything else is dropped. */
const SAFEID=/^[A-Za-z0-9_-]{1,40}$/;
function setConfig(list){const ok=[];for(const a of Array.isArray(list)?list:[]){if(!a||!SAFEID.test(String(a.id))||!Array.isArray(a.fields))continue;ok.push({id:String(a.id),name:String(a.name||a.id),short:String(a.short||a.name||a.id),color:/^#[0-9a-f]{6}$/i.test(a.color)?a.color:'#44566A',cur:a.cur==='USD'?'USD':'ILS',fields:cleanFields(a.fields),
  /* components switched off: their keys, so switching one back on reuses the key its history sits under */
  gone:cleanFields(a.gone)})}ACCOUNTS=ok;FIELDS=ok.flatMap(a=>a.fields.map(f=>f[0]))}
const KEY='ft.data.v1', META='ft.meta.v1';
let S={updates:[],ports:{},ptype:{},plink:{},priv:false,pmask:{},fh:'',tick:{},rec:{}}, cryptoKey=null, encMeta=null, tab='home';

const num=v=>{
  if(typeof v==='number')return Number.isFinite(v)?v:0;
  const raw=String(v??'');
  const t=raw.replace(/[\u2212\u2012-\u2015]/g,'-').trim();  /* a real minus sign, or a dash */
  /* a minus can arrive in three shapes: before, after, or as brackets around the number */
  const neg=/^\(\s*[\d.,\s]+\s*\)$/.test(t)||/^-/.test(t)||/-\s*$/.test(t);
  const x=parseFloat(t.replace(/[^0-9.]/g,''));              /* commas, ₪, $, spaces, RTL marks */
  if(!Number.isFinite(x))return 0;
  return neg?-Math.abs(x):x;
};
/* ---------- private mode ----------
   for when the screen is not only mine: an account can be left out altogether, or shown at
   half its value. display only — while it is on nothing can be written, so a masked number
   can never be saved back as real data. the backup and the CSV always hold the real amounts. */
const PRIV=()=>!!S.priv;
const maskOf=id=>{const m=S.pmask&&S.pmask[id];return m==='half'||m==='hide'?m:'full'};
const facOf=id=>!PRIV()?1:(maskOf(id)==='hide'?0:maskOf(id)==='half'?.5:1);
const isHidden=id=>PRIV()&&maskOf(id)==='hide';
const visAcc=()=>ACCOUNTS.filter(a=>!isHidden(a.id));
const anyMask=()=>ACCOUNTS.some(a=>maskOf(a.id)!=='full');
const share=(v,t)=>t?(v/t*100).toFixed(1):'0.0';

function calcAt(u,raw){
  const r={acc:{},usdAcc:{},total:0,usd:0};
  for(const a of ACCOUNTS){const q=raw?1:facOf(a.id);let s=0;for(const [k] of a.fields){const m=a.cur==='USD'?num(u.rate):1;const v=num(u.vals[k])*m*q;s+=v;if(a.cur==='USD'){r.usd+=num(u.vals[k])*q;r.usdAcc[a.id]=(r.usdAcc[a.id]||0)+num(u.vals[k])*q}}r.acc[a.id]=s;r.total+=s}
  return r;
}
const calc=u=>calcAt(u,false);     /* what the screen shows */
const calcRaw=u=>calcAt(u,true);   /* what leaves the app */
const sorted=()=>[...S.updates].sort((a,b)=>a.date<b.date?-1:1);

/* ---------- colour ----------
   account colours are chosen by the person, so some of them are too dark to read on a dark
   surface. rather than overriding their choice, the same hue is lifted to a readable lightness
   while the scheme is dark, and handed back untouched while it is light. */
const DARK=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const hex2hsl=h=>{
  const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return[0,0,l];
  const s=l>.5?d/(2-mx-mn):d/(mx+mn);
  let hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;
  return[hh*60,s,l];
};
const hsl2hex=(h,s,l)=>{
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+t.map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
};
const colCache={};
function acol(hex){
  if(!DARK()||!/^#[0-9a-f]{6}$/i.test(hex))return hex;
  const k=hex.toLowerCase();if(colCache[k])return colCache[k];
  const [h,sa,l]=hex2hsl(k);
  /* lift, don't level: raising every colour to the same lightness would merge two accounts
     whose hues are close and whose only difference was how dark they were. */
  const nl=Math.max(.42,Math.min(.82,l+.20*(1-l)));
  return colCache[k]=nl<=l+.005?hex:hsl2hex(h,Math.min(sa,.85),nl);
}
const chartInk=()=>DARK()?'#F2F2F7':'#1C1C1E';

/* ---------- format ---------- */
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const ils=v=>(v<0?'−':'')+'₪'+nf0.format(Math.abs(Math.round(v)));
const usd=v=>(v<0?'−':'')+'$'+nf0.format(Math.abs(Math.round(v)));
const signedBy=(v,f)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v));   // e.g. +₪40,873 / −$1,989
/* beside an arrow the sign is the third thing saying the same thing, after the arrow and the
   colour; the magnitude alone reads cleaner and is shorter */
const magIls=v=>ils(Math.abs(v));
/* a plain CSS ellipsis cuts by pixel and lands inside a number — "ממשלתית צמודה 2% 0431"
   became "…31 2%". trimming at the last space keeps every token whole; the CSS ellipsis
   stays on as a backstop for a name of unusually wide glyphs. */
function short(t,n){
  const x=String(t||'').trim();
  const latin=!/[א-ת]/.test(x);
  const lim=n||(latin?19:20);
  if(x.length<=lim)return latin?'\u2066'+x+'\u2069':x;
  const cut=x.slice(0,lim), sp=cut.lastIndexOf(' ');
  const out=(sp>lim*0.5?cut.slice(0,sp):cut).replace(/[\s.,/-]+$/,'')+'…';
  return latin?'\u2066'+out+'\u2069':out;
}
const magBy=(v,f)=>f(Math.abs(v));
const pct=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%';
/* ±0.5 is the right nothing-happened band for shekels, and far too wide for a dollar price:
   where a base is known the band is a tenth of a percent of it instead */
const eps=base=>base?Math.max(Math.abs(base)*0.001,0.005):0.5;
const cls=(v,base)=>{const e=eps(base);return v>e?'up':v<-e?'down':'flat'};
const arrow=(v,base)=>{const e=eps(base);return v>e?'▲':v<-e?'▼':'●'};

function readRaw(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}

function save(){

     (a refresh that lands late) must not write that empty state over the encrypted store. the
     only plaintext write over an encrypted one is removing the lock, which says so explicitly. */
  if(!cryptoKey&&!plainOK){const r=readRaw();if(r&&r.enc)return saveChain}
  saveChain=saveChain.then(async()=>{
    const plain=JSON.stringify({v:4,accounts:ACCOUNTS,updates:S.updates,ports:S.ports,ptype:S.ptype,plink:S.plink,priv:S.priv,pmask:S.pmask,fh:S.fh,td:S.td,tick:S.tick,rec:S.rec});

    else out={enc:0,data:JSON.parse(plain)};

function applyPlain(pt){

async function unlock(pass){
  const raw=readRaw();
  if(raw.wrap){
    /* written by the build that offered Face ID: the file is sealed with a random data key,
       and that key is wrapped under the passcode. Read it, then rewrite in this build's format. */
    const w=raw.wrap.pass;
    if(!w)throw new Error('no-pass-wrap');
    const kek=await deriveKey(pass,unb64(w.salt));
    const dkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},kek,unb64(w.ct));
    const dk=await crypto.subtle.importKey('raw',dkRaw,{name:'AES-GCM'},false,['decrypt']);
    applyPlain(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},dk,unb64(raw.ct)));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    cryptoKey=await deriveKey(pass,salt);encMeta={salt:b64(salt),pinLen:pinLenOf(pass)};
    await save();
    return;
  }
  const k=await deriveKey(pass,unb64(raw.salt));
  applyPlain(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},k,unb64(raw.ct)));
  cryptoKey=k;encMeta={salt:raw.salt,pinLen:pinLenOf(pass)};
  if(storedPinLen(raw)!==encMeta.pinLen)save();
}

function loadPorts(d,fresh){

  if(typeof d.td==='string'&&(fresh||d.td.trim()))S.td=d.td.trim().slice(0,80);
  for(const k in (d.tick||{})){const v=String(d.tick[k]||'').toUpperCase().replace(/[^A-Z0-9.\-]/g,'').slice(0,12);if(v)S.tick[String(k)]=v}

  for(const id in (d.pmask||{}))if(ok.has(id)&&['half','hide'].includes(d.pmask[id]))S.pmask[id]=d.pmask[id];
  for(const id in (d.ports||{})){
    if(!ok.has(id))continue;
    const list=(Array.isArray(d.ports[id])?d.ports[id]:[]).filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)).map(cleanSnap);
    if(!list.length)continue;
    const have=new Map((S.ports[id]||[]).map(p=>[p.date,p]));
    for(const p of list)have.set(p.date,p);                  /* same date: the file wins */
    S.ports[id]=[...have.values()].sort((a,b)=>a.date<b.date?-1:1);
  }
  for(const k in (d.ptype||{}))if(['stock','bond','fund','cash'].includes(d.ptype[k]))S.ptype[String(k)]=d.ptype[k];
  for(const id in (d.plink||{})){
    if(!ok.has(id))continue;
    const v=d.plink[id],keys=(Array.isArray(v)?v:[v]).map(String).filter(Boolean);
    if(keys.length)S.plink[id]=keys.length>1?keys:keys[0];

}

function clean(list){
  const out=[];const seen=new Set();
  for(const u of Array.isArray(list)?list:[]){
    if(!u||!/^\d{4}-\d{2}-\d{2}$/.test(u.date)||seen.has(u.date))continue;seen.add(u.date);

       back on brings its history back. only deleting the account removes them. */
    const vals={};for(const k in (u.vals||{}))if(SAFEID.test(k))vals[k]=num(u.vals[k]);

    out.push({date:u.date,vals,rate:num(u.rate)});
  }

function niceTicks(lo,hi,n=4){
  if(lo===hi){const p=Math.abs(lo)*0.01||1;lo-=p;hi+=p}
  const pad=(hi-lo)*0.18;lo-=pad;hi+=pad;
  const mag=Math.pow(10,Math.floor(Math.log10((hi-lo)/n||1)));
  let step=mag,a=0,b=0;
  for(const f of [1,2,2.5,5,10,20,25,50,100]){                 /* climb until the grid is n+1 lines at most */
    step=f*mag;a=Math.floor(lo/step)*step;b=Math.ceil(hi/step)*step;
    if(Math.round((b-a)/step)+1<=n+1)break;
  }
  const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));
  return {min:a,max:b,ticks:t};
}

  return v=>nf0.format(v)}

   is thinned rather than cropped: the first and the last are kept, and the points in between are
   the ones nearest to evenly spaced moments in time — so a year of weekly entries still reads as
   a year, with the gaps where the gaps really were. */
const CHARTMAX=24;
function sampleEven(pts,max){
  const m=max||CHARTMAX;
  if(pts.length<=m)return pts;
  const t=pts.map(p=>Date.parse(p.d));
  const ok=t.every(Number.isFinite)&&t[t.length-1]>t[0];
  const keep=new Set([0,pts.length-1]);
  for(let i=1;i<m-1;i++){
    const f=i/(m-1);
    let best=0;
    if(ok){const want=t[0]+(t[t.length-1]-t[0])*f;let bd=Infinity;
      for(let j=0;j<t.length;j++){const d=Math.abs(t[j]-want);if(d<bd){bd=d;best=j}}}
    else best=Math.round(f*(pts.length-1));
    keep.add(best);
  }

}
/* line with point markers; y-axis hugs the data (a bit below the lowest, a bit above the highest) */

  const W=340,H=o.h||170,AX=46,PR=10,T=14,B=24,dark=!!o.dark;   // AX: width reserved for the value axis, on the left
  const vs=pts.map(p=>p.v);const {min,max,ticks}=niceTicks(Math.min(...vs),Math.max(...vs));const tf=tickFmt(ticks);

/* Several series on one pair of axes only works when they share a unit. Money does not: an
   account of ₪5M and one of ₪75K cannot be read together. So every series is re-based to its own
   first point and drawn as a percentage change, which is the question being asked anyway — which

  out+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;

}

function wirePct(box,series){

  const hit=svg.querySelector('.hit'),cross=svg.querySelector('.cross');
  const t0=+hit.dataset.t0,t1=+hit.dataset.t1,AX=50,R=320;        /* the plot runs x=50..320 */
  const valAt=(pts,t)=>{
    const ts=pts.map(p=>Date.parse(p.d));
    if(t<ts[0]-864e5/2||t>ts[ts.length-1]+864e5/2)return null;     /* outside this line: say nothing */
    if(t<=ts[0])return pts[0].v;
    for(let i=1;i<ts.length;i++)if(t<=ts[i]){const f=(t-ts[i-1])/(ts[i]-ts[i-1]||1);return pts[i-1].v+(pts[i].v-pts[i-1].v)*f}
    return pts[pts.length-1].v;

  }).filter(Boolean).join(' · ');

/* ---------- rolling numbers ----------
   a total that jumps has no relation to the one before it. each digit column is a strip that
   springs to its new face, and only the columns that actually changed move. the springs are
   interruptible, so a second change mid-flight redirects rather than queues. */
const rollMem={};
function roll(el,id,val,fmt,o={}){
  const next=fmt(val),prev=rollMem[id];
  rollMem[id]=val;
  if(prev===undefined||prev===val||calm()||PRIV()){el.classList.remove('roll');el.textContent=next;return}
  const a=[...fmt(prev)],b=[...next];
  el.textContent='';el.classList.add('roll');
  /* the strips spell out every digit face, so the value is carried separately for a screen reader */
  const sr=document.createElement('span');sr.className='sr';sr.textContent=next;el.appendChild(sr);
  const cells=document.createElement('span');cells.setAttribute('aria-hidden','true');el.appendChild(cells);
  const moves=[];
  b.forEach((ch,i)=>{
    const cell=document.createElement('span');
    const j=a.length-(b.length-i);                   // line the two numbers up from the right
    const from=/\d/.test(ch)&&j>=0&&/\d/.test(a[j])?+a[j]:null;
    if(from===null||from===+ch){                     /* a digit that does not move is just a digit */
      cell.className='sep';cell.textContent=ch;cells.appendChild(cell);return;
    }
    cell.className='dig';
    const strip=document.createElement('u'),to=+ch;
    const lo=Math.min(from,to),hi=Math.max(from,to); /* only the faces it actually passes */
    for(let d=lo;d<=hi;d++){const f=document.createElement('b');f.textContent=d;strip.appendChild(f)}
    const n=hi-lo+1;
    cell.appendChild(strip);
    const sp=Spring(y=>{strip.style.transform=`translateY(${(-(y-lo)*100/n).toFixed(3)}%)`});
    sp.jump(from);
    moves.push([sp,to]);
    cells.appendChild(cell);
  });
  const gap=o.stagger!=null?o.stagger:34,res=o.response||.5;
  moves.forEach(([sp,target],k)=>{
    const go=()=>sp.to(target,{damping:.8,response:res});
    gap?setTimeout(go,k*gap):go();
  });
}

  openLayer(h);
  const read=()=>{

        const keys=subs&&subs.length?guessKeys(a,subs):plinkOf(a.id);
        /* a statement fills one field per sub-account, in the order they were mapped last time */
        if(subs&&keys.length>=subs.length){

    for(const id in attach)addSnapshot(id,u.date,attach[id]);closeLayer();tab='home';render();save();toast(Object.keys(attach).length?'העדכון והאחזקות נשמרו':Object.keys(drop).length?'העדכון נשמר והאחזקות נמחקו':'העדכון נשמר')};

let liveRate=null,liveAt=0;
async function showLiveRate(sel){
  if(offscreen)return;
  const el=$(sel);if(!el)return;
  if(liveRate&&Date.now()-liveAt<3600000){el.textContent='₪'+liveRate.toFixed(3);el.classList.remove('flat');return}
  el.textContent='…';
  try{const r=await fetchRate(today());liveRate=r.rate;liveAt=Date.now();
    const e2=$(sel);if(e2){e2.textContent='₪'+r.rate.toFixed(3);e2.classList.remove('flat')}}
  catch(e){const e2=$(sel);if(e2)e2.textContent='לא זמין'}
}
function findRate(j){let found=null;(function walk(o,key){if(found!==null||o==null)return;if(typeof o==='number'){if(o>=2&&o<=6&&(/rate|ils|value/i.test(key||'')))found=o;return}if(typeof o==='object')for(const k in o)walk(o[k],k)})(j,'');return found}
async function fetchRate(d){
  const srcs=[[`https://api.frankfurter.dev/v2/rate/usd/ils?date=${d}&providers=boi`,'יציג (בנק ישראל)'],[`https://api.frankfurter.dev/v1/${d}?base=USD&symbols=ILS`,'אירופי (ECB)']];
  for(const [url,src] of srcs){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),7000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(t);if(!r.ok)continue;const j=await r.json();const rate=findRate(j);
    const dd=String((Array.isArray(j)?j[0]&&j[0].date:j.date)||'');
    if(rate)return {rate,src,date:ISODAY.test(dd)?dd:d}}catch(e){}}
  throw new Error('no rate');
}

/* every holding of every account, converted to shekels with the rate of its own update, so two
   accounts in two currencies can be ranked against each other */
function allHoldings(){
  const U=sorted(),last=U[U.length-1];
  const out=[];
  for(const a of ACCOUNTS){
    if(isHidden(a.id))continue;
    const snap=portsOf(a.id).slice(-1)[0];
    if(!snap||!snap.hold)continue;
    const m=a.cur==='USD'?num(last&&last.rate)||0:1;
    for(const h of snap.hold)out.push({...h,ils:h.v*m,acc:a,
      where:a.short+(h.acct&&(snap.hold.some(o=>o.acct&&o.acct!==h.acct))?' · '+subShort(h.acct):'')});
  }
  return out.sort((x,y)=>y.ils-x.ils);
}
/* what is held in a currency other than the shekel: a dollar account in full, and the
   dollar-quoted securities sitting inside a shekel account */
function fxExposure(){
  const U=sorted(),last=U[U.length-1];if(!last)return null;
  const C=calc(last);
  let fx=0;const by={};
  for(const a of ACCOUNTS){
    if(isHidden(a.id))continue;
    if(a.cur==='USD'){fx+=C.acc[a.id];by[a.id]=C.acc[a.id];continue}
    const snap=portsOf(a.id).slice(-1)[0];
    if(!snap||!snap.hold)continue;
    const v=snap.hold.filter(h=>h.cur&&h.cur!=='שקל').reduce((n,h)=>n+h.v,0);
    if(v>0){fx+=v;by[a.id]=v}
  }
  return {fx,total:C.total,by};
}
const SPYCOL='#6D4AC4';
/* the percent chart's menu: the total, each account, and the index when a key is set */
function cmpSeries(){
  const U=sorted(),C=U.map(calc);
  const out=[{id:'total',name:'כל החשבונות',color:chartInk(),wide:true,pts:U.map((u,i)=>({d:u.date,v:C[i].total}))}];
  for(const a of visAcc())out.push({id:a.id,name:a.short,color:acol(a.color),
    /* in shekels, like the table above it, so both say the same percent */
    pts:U.map((u,i)=>({d:u.date,v:C[i].acc[a.id]}))});
  const spy=PX.SPY&&PX.SPY.pts;
  if(spy&&U.length){
    const from=U[0].date,to=U[U.length-1].date;
    const win=spy.filter(p=>p.d>=from&&p.d<=to);
    if(win.length>1)out.push({id:'SPY',name:'S&P 500',color:acol(SPYCOL),dash:true,pts:win});
  }
  return out;
}
/* re-based: each series starts at zero and is read as its change in percent since then */
const toPct=se=>{
  const i=se.pts.findIndex(p=>p.v>0);
  if(i<0)return null;
  const pts=se.pts.slice(i),base=pts[0].v;
  if(pts.length<2)return null;
  return {...se,pts:pts.map(p=>({d:p.d,v:(p.v/base-1)*100}))};
};
function viewCompare(){
  const U=sorted();let h=`<div class="pagehead"><h1>השוואה</h1><p>שני תאריכים, זה מול זה</p></div>`;

  /* the default window is the whole tracked period; a date the reader picks is kept */
  const st=viewCompare.st||(viewCompare.st={});
  if(!U.some(u=>u.date===st.a))st.a=U[0].date;
  if(!U.some(u=>u.date===st.b))st.b=U[U.length-1].date;

  const tbl=(title,rows)=>{let t=`<section><h2>${title}</h2><div class="panel tblwrap"><table class="cmp"><thead><tr><th></th><th class="n">${dshort(A.date)}</th><th class="n">${dshort(B.date)}</th><th>שינוי</th></tr></thead><tbody>`;
    let sa=0,sb=0;for(const [nm,va,vb,col] of rows){sa+=va;sb+=vb;const d=vb-va;
      t+=`<tr><td>${col?`<span style="color:${col}">●</span> `:''}${nm}</td><td class="n">${compact(va)}</td><td class="n">${compact(vb)}</td><td class="d"><span class="n ${cls(d)}">${arrow(d)} ${magIls(d)}</span><small class="n ${cls(d)}">${va?pct(d/va):''}</small></td></tr>`}
    const d=sb-sa;return t+`<tr class="tot"><td>סה״כ</td><td class="n">${compact(sa)}</td><td class="n">${compact(sb)}</td><td class="d"><span class="n ${cls(d)}">${arrow(d)} ${magIls(d)}</span><small class="n ${cls(d)}">${sa?pct(d/sa,2):''}</small></td></tr></tbody></table></div></section>`};
  h+=tbl('לפי חשבון',visAcc().map(a=>[esc(a.short),ca.acc[a.id],cb.acc[a.id],acol(a.color)]));
  /* ---- the percent chart: any number of series, each from its own starting point ---- */

     and every line is re-based to its first point inside it */

  const clip=se=>{const pts=se.pts.filter(p=>p.d>=from&&p.d<=to);return pts.length>1?{...se,pts}:null};
  const pick=all.filter(x=>st.sel.includes(x.id)).map(clip).filter(Boolean).map(toPct).filter(Boolean);
  const thin=!pick.length&&st.sel.length;

  h+=`<section><h2>מי צמח יותר <small>הכול באחוזים</small></h2>

  ${!PX.SPY&&S.td?`<div class="chipadd"><button data-spy="1">+ S&amp;P 500</button></div>`:''}</div>

  }

      st.sel=[...new Set([...st.sel,'SPY'])];viewCompare();
    }
    catch(e){sp.textContent='+ S&P 500';toast(e.message==='rate'?'חריגה ממגבלת הבקשות לדקה':e.message==='key'?'מפתח Twelve Data נדחה':'לא הצלחתי למשוך את המדד')}
  };
  if(pick.length)wirePct($('#ch-pct'),pick);
}

/* ---------- the account book ----------
   accounts are not in the code: they are built here, on the device, and travel only in the backup.

/* a working copy of one account: the standard components, plus anything it already holds that
   is not one of them, so editing an existing account never drops a field by surprise */
function accDraft(a){
  const used=new Set();
  const rows=PARTS.map(([lbl,t])=>{
    const f=(a?a.fields:[]).find(x=>x[1]===lbl&&!used.has(x[0]));
    const g=f?null:(a?a.gone:[]).find(x=>x[1]===lbl&&!used.has(x[0]));
    const k=f||g;if(k)used.add(k[0]);
    return {key:k?k[0]:fresh('f'),label:lbl,type:t,on:!!f,trend:k?!!k[3]:false,std:true};
  });
  for(const f of (a?a.fields:[]))if(!used.has(f[0])){used.add(f[0]);rows.push({key:f[0],label:f[1],type:f[2],on:true,trend:!!f[3],std:false})}
  for(const f of (a?a.gone:[]))if(!used.has(f[0])){used.add(f[0]);rows.push({key:f[0],label:f[1],type:f[2],on:false,trend:!!f[3],std:false})}
  return {id:a?a.id:fresh('a'),name:a?a.name:'',short:a?a.short:'',cur:a?a.cur:'ILS',
    color:a?a.color:PALETTE[ACCOUNTS.length%PALETTE.length],rows,link:a?(plinkOf(a.id)[0]||''):'',focus:''};
}

/* ---------- a holding's own price history ----------
   every bank file carries the closing price of each security, so each upload leaves one point
   behind. no outside source, no key, nothing sent anywhere: the resolution is simply the rate at
   which files are uploaded. shekel-quoted securities are priced in agorot, as the bank quotes them. */
function priceSeries(accId,holdId,days){
  const from=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):'';
  const out=[];
  for(const snap of portsRaw(accId)){
    if(!snap.hold)continue;                      /* the oldest snapshots keep only their totals */
    if(from&&snap.date<from)continue;
    const h=snap.hold.find(y=>String(y.id)===String(holdId));
    if(h&&h.price>0)out.push({d:snap.date,v:h.price});
  }
  return out;
}
/* ---------- a year of daily closes, for the securities a free source covers ----------
   Twelve Data's free plan is US listings only, so this reaches the shares and the ETFs quoted in
   dollars and nothing else; everything else keeps the chart built from the uploaded files above.
   The series is held in memory for the session and never written to the stored blob: it is market
   data, it is one request to get back, and 250 points per security would bloat every save. */

const pxBusy=new Set(),pxErr={};
const PXDAY=12*60*60*1000;
const pxTick=x=>x.cur==='דולר'?tickOf(x):'';
async function fetchPx(sym){
  if(!S.td)throw new Error('no-key');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch('https://api.twelvedata.com/time_series?interval=1day&outputsize=1300&symbol='+
      encodeURIComponent(sym)+'&apikey='+encodeURIComponent(S.td),{signal:ctl.signal});
    const j=await r.json();
    if(j.code===401||j.code===403)throw new Error('key');
    if(j.code===429)throw new Error('rate');
    if(!Array.isArray(j.values)||!j.values.length)throw new Error('empty');
    const pts=j.values.map(v=>({d:String(v.datetime).slice(0,10),v:parseFloat(v.close)}))
      .filter(v=>Number.isFinite(v.v)).reverse();                 /* the API returns newest first */
    if(pts.length<2)throw new Error('empty');
    return {ts:Date.now(),pts};
  }finally{clearTimeout(t)}
}

  if(!svg||!hit)return;

  const val=box.querySelector('.pxval'),dl=box.querySelector('.pxdelta'),when=box.querySelector('.pxwhen');
  const xs=hit.dataset.xs.split(',').map(Number);
  const fmt=pxUsd,first=pts[0].v,base=dl.textContent,baseWhen=when.textContent;
  const show=i=>{
    const p=pts[i],d=p.v-first;
    val.textContent=fmt(p.v);
    dl.textContent=arrow(d,first)+' '+magBy(d,fmt)+(first?' · '+pct(d/first,1):'');
    dl.className='n pxdelta '+cls(d,first);
    when.textContent=dlong(p.d);
    const vb=svg.viewBox.baseVal,y=parseFloat(svg.querySelector('polyline').getAttribute('points').split(' ')[i].split(',')[1]);
    cross.setAttribute('x1',xs[i]);cross.setAttribute('x2',xs[i]);cross.setAttribute('opacity','1');
    knob.setAttribute('cx',xs[i]);knob.setAttribute('cy',y);knob.setAttribute('opacity','1');
  };
  const rest=()=>{
    const p=pts[pts.length-1],d=p.v-first;
    val.textContent=fmt(p.v);dl.textContent=base;dl.className='n pxdelta '+cls(d,first);
    when.textContent=baseWhen;cross.setAttribute('opacity','0');knob.setAttribute('opacity','0');
  };
  const at=cx=>{
    const r=svg.getBoundingClientRect();
    const vx=(cx-r.left)/r.width*svg.viewBox.baseVal.width;
    let best=0,bd=Infinity;
    for(let i=0;i<xs.length;i++){const dd=Math.abs(xs[i]-vx);if(dd<bd){bd=dd;best=i}}
    show(best);
  };
  let on=false;
  hit.addEventListener('pointerdown',e=>{on=true;hit.setPointerCapture(e.pointerId);at(e.clientX)});
  hit.addEventListener('pointermove',e=>{if(on)at(e.clientX)});
  for(const ev of ['pointerup','pointercancel','pointerleave'])hit.addEventListener(ev,()=>{if(on){on=false;rest()}});
}
/* no axes, no grid, no markers — just the line, its baseline and a fill under it */
function pxChart(pts,col,label){
  const W=358,H=170,PADY=10;
  const vs=pts.map(p=>p.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi===lo){hi+=Math.abs(hi)*0.01||1;lo-=Math.abs(lo)*0.01||1}
  const x=i=>pts.length<2?W/2:i*W/(pts.length-1);
  const y=v=>PADY+(hi-v)*(H-PADY*2)/(hi-lo);
  const pt=pts.map((p,i)=>x(i).toFixed(2)+','+y(p.v).toFixed(2)).join(' ');
  const base=y(pts[0].v).toFixed(2);
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="pxchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".18"></stop>
      <stop offset="1" stop-color="${col}" stop-opacity="0"></stop></linearGradient></defs>
    <polygon class="fadein" fill="url(#${id})" points="0,${H} ${pt} ${W},${H}"></polygon>
    <line class="pxbase" x1="0" x2="${W}" y1="${base}" y2="${base}"></line>
    <polyline class="draw" pathLength="1" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      vector-effect="non-scaling-stroke" points="${pt}"></polyline>
    <line class="pxcross" x1="0" x2="0" y1="0" y2="${H}" opacity="0"></line>
    <circle class="pxknob" r="4.5" cx="0" cy="0" fill="${col}" opacity="0"></circle>
    <rect class="pxhit" x="0" y="0" width="${W}" height="${H}" fill="transparent"
      data-xs="${pts.map((p,i)=>x(i).toFixed(1)).join(',')}"></rect></svg>`;
}

/* ---------- analyst consensus ----------
   Only for shares listed abroad: the free sources cover US-listed companies, and bonds and
   funds have no analyst coverage at all. The key lives in the encrypted store on this device,
   never in the code, because the page itself is public. */
const hmonth=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('he-IL',{month:'long',year:'numeric'})}catch(e){return d}};
const RECDAY=20*60*60*1000;                       /* a consensus does not move hourly */
const RECSOON=30*60*1000;                         /* what a deliberate pull down counts as stale */
const recBusy=new Set();                          /* symbols being fetched right now */
const recErr={};                                  /* and the ones that just failed, so a retry can be offered */
const isForeignStock=x=>catOf(x)==='stock-intl';
/* the bank file already carries a ״סימבול״ column, and for a US-listed share it IS the ticker,
   so nothing needs typing. Anything else in that column is not one: bonds arrive as
   "BA 2.7 2/2" and non-US listings as "VITB SS" (Stockholm) or "CSU CN" (Toronto), and the free
   sources cover US listings only — so those are left for the user to fill in or leave empty. */
const autoTick=x=>{
  const s=String((x&&x.sym)||'').toUpperCase().replace(/[^A-Z0-9./\- ]/g,'').trim();
  if(!/^[A-Z][A-Z0-9]{0,4}([./][A-Z])?$/.test(s))return '';
  return s.replace('/','.');                 /* BRK/B is BRK.B at Finnhub */
};
const tickOf=x=>S.tick[x.id]||autoTick(x);
const tickMan=x=>!!S.tick[x.id];
function recScore(r){
  const n=r.sb+r.b+r.h+r.s+r.ss;
  if(!n)return null;
  return {n,score:(r.sb*1+r.b*2+r.h*3+r.s*4+r.ss*5)/n};
}
function recVerdict(r){
  const v=recScore(r);if(!v)return null;
  const q=v.score;
  const label=q<1.5?'קנייה חזקה':q<2.5?'קנייה':q<3.5?'החזקה':q<4.5?'מכירה':'מכירה חזקה';
  const cls=q<2.5?'buy':q<3.5?'hold':'sell';
  return {label,cls,n:v.n};
}
async function fetchRec(sym){
  if(!S.fh)throw new Error('no-key');
  const base='https://finnhub.io/api/v1/';
  const get=async path=>{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
    try{const r=await fetch(base+path+'&token='+encodeURIComponent(S.fh),{signal:ctl.signal});
      clearTimeout(t);
      if(r.status===401||r.status===403)throw new Error('key');
      if(!r.ok)throw new Error('http');
      return await r.json();
    }finally{clearTimeout(t)}
  };
  const list=await get('stock/recommendation?symbol='+encodeURIComponent(sym));
  if(!Array.isArray(list)||!list.length)throw new Error('empty');
  const a=list[0];
  const out={ts:Date.now(),sb:num(a.strongBuy),b:num(a.buy),h:num(a.hold),s:num(a.sell),ss:num(a.strongSell),
    period:String(a.period||''),tm:0,tl:0,th:0,px:0};
  /* the price target and the quote may sit behind a paid plan; they are a bonus, not a requirement */
  try{const pt=await get('stock/price-target?symbol='+encodeURIComponent(sym));
    out.tm=num(pt.targetMean);out.tl=num(pt.targetLow);out.th=num(pt.targetHigh)}catch(e){}
  try{const q=await get('quote?symbol='+encodeURIComponent(sym));out.px=num(q.c)}catch(e){}
  return out;
}
/* force: fetch everything. maxAge: how old a cached answer may be. budget: give up after this
   long, so a pull down cannot hang on a slow network. The gap between symbols keeps a whole
   portfolio under the free tier's per-minute ceiling. */
async function refreshRecs(force,maxAge,budget){
  if(!S.fh)return 0;
  const age=force?0:(maxAge||RECDAY),end=budget?Date.now()+budget:0;
  const want=new Set();
  for(const id in S.ports)for(const x of (portsRaw(id).slice(-1)[0]||{}).hold||[])
    if(isForeignStock(x)&&tickOf(x))want.add(tickOf(x));
  let got=0,n=0;
  for(const sym of want){
    const cur=S.rec[sym];
    if(cur&&Date.now()-cur.ts<age)continue;
    if(recBusy.has(sym))continue;
    if(end&&Date.now()>end)break;
    if(n++)await new Promise(r=>setTimeout(r,120));
    recBusy.add(sym);
    try{S.rec[sym]=await fetchRec(sym);delete recErr[sym];got++}
    catch(e){recErr[sym]=e.message;if(e.message==='key'){toast('מפתח ה-API נדחה');recBusy.delete(sym);break}}
    finally{recBusy.delete(sym)}
  }
  if(got){save();recPaintOpen()}
  return got;
}

}

    if(busy)return h+`<div class="panel pad" style="margin-top:10px"><div class="recwait"><span class="ring"></span><span>מושך המלצות…</span></div></div></section>`;
    const why=fail==='empty'?'אין כיסוי אנליסטים לנייר הזה.':fail==='key'?'מפתח ה-API נדחה. הגדרות ← המלצות אנליסטים.':'לא הצלחתי למשוך כרגע.';
    return h+`<p class="hint">${why}</p><div class="stackbtns"><button class="btn ghost" data-recload="${esc(t)}">נסה שוב</button></div></section>`;

  h+=`<div class="panel pad" style="margin-top:10px">

  <div class="cons">${seg(r.sb,'var(--up)')}${seg(r.b,'var(--up2)')}${seg(r.h,'var(--muted)')}${seg(r.s,'var(--down)')}${seg(r.ss,'var(--down)')}</div>
  <div class="legend">
    ${r.sb?`<span><b style="background:var(--up)"></b>קנייה חזקה <span class="n">${r.sb}</span></span>`:''}
    ${r.b?`<span><b style="background:var(--up2)"></b>קנייה <span class="n">${r.b}</span></span>`:''}
    ${r.h?`<span><b style="background:var(--muted)"></b>החזקה <span class="n">${r.h}</span></span>`:''}
    ${r.s||r.ss?`<span><b style="background:var(--down)"></b>מכירה <span class="n">${r.s+r.ss}</span></span>`:''}
  </div></div>`;
  if(r.tm)h+=`<div class="panel facts" style="margin-top:10px">
    ${r.px?`<div><small>מחיר נוכחי</small><b class="n">${pxUsd(r.px)}</b></div>`:''}

    ${r.tl&&r.th?`<div><small>היעד הנמוך</small><b class="n">${pxUsd(r.tl)}</b></div><div><small>היעד הגבוה</small><b class="n">${pxUsd(r.th)}</b></div>`:''}

  <div class="stackbtns"><button class="btn ghost" data-recload="${esc(t)}">${busy?'מושך…':'רענון'}</button></div></section>`;
  return h;
}

/* ---------- backup ---------- */
async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true;
}
async function doBackup(){if(!S.updates.length){toast('אין עדיין נתונים לגיבוי');return}
  const ok=await shareFile(`finance-backup-${today()}.json`,JSON.stringify({app:'finance-tracker',v:4,exported:new Date().toISOString(),accounts:ACCOUNTS,updates:sorted(),ports:S.ports,ptype:S.ptype,plink:S.plink,priv:S.priv,pmask:S.pmask,fh:S.fh,td:S.td,tick:S.tick,rec:S.rec},null,1),'application/json');

function openImport(){
  openLayer(`<div class="sheet modal" role="dialog" aria-label="טעינת גיבוי"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>טעינת גיבוי</h2><span></span></header><div class="body">

  <section><h2>או בהדבקה</h2><div class="panel pad"><textarea id="itext" placeholder='{"app":"finance-tracker", ...}' aria-label="תוכן הגיבוי"></textarea><button class="btn ghost" id="ipaste" style="margin-top:10px">טעינה מהטקסט</button></div></section>
  <section><p style="font-size:0.7647rem;color:var(--muted);margin:0 6px">הגיבוי מתמזג עם מה שקיים: עדכונים וצילומי אחזקות מתווספים, ומה שיש בשני התאריכים נלקח מהגיבוי. מה שאין בגיבוי — צילום חדש יותר, מפתח API — נשאר.</p></section></div></div>`);

      if(!row){row={y,its:[]};rows.push(row)}

      r.its.sort((a,b)=>a.x-b.x);

    if(!period){const m=head.match(/Statement Period[:\s]+\w+ \d+\s*-\s*(\w+ \d+, \d{4})/);if(m)period=m[1]}

      const t=raw.trim();if(!t)continue;
      const end=t.match(/^ENDING ACCOUNT VALUE\s+\$?([\d,]+\.\d\d)/);
      if(end){
        const roth=/ROTH|IRA/.test(lines.slice(0,14).join(' '));
        cur={kind:roth?'ira':'ind',total:pdfNum(end[1]),hold:[]};accs.push(cur);inHold=false;flush();continue;
      }

         the name of whichever holding is still open across the break */
      if(/Acct #|Statement Period|^Page \d+ of|^[A-Z]\.[A-Z]\. [A-Z][a-z]+ ?(?:Securities|LLC)?$|Please read|STATEMENT SUMMARY|IMPORTANT INFORMATION|Self-Directed|disclosure/i.test(t))continue;
      if(/^(Activity|Total Account Value)/.test(t)){flush();inHold=false;continue}
      if(/^(TOTAL|Description|Acquisition|Est\.|\.+|I WILL SHOW|CASH & MONEY|EQUITY|Unless|\*|See additional|A - Average|M - Margin|MT - Mixed|AI Pricing)/.test(t)){
        if(t.startsWith('TOTAL'))flush();continue;
      }
      const cols=t.split(/\s{2,}/).filter(Boolean);
      const nums=cols.filter(c=>PNUM.test(c));
      const sym=t.match(/Symbol:\s*([A-Z.\-]{1,8})/);

const isPdf=f=>/\.pdf$/i.test(f.name||'')||f.type==='application/pdf';

async function readHoldings(file){
  if(!isPdf(file))return {hold:parsePortfolio(await readSheet(file)),subs:null,date:''};
  const st=parseStatement(await readPdfLines(file));
  const hold=[];
  for(const acc of st.accounts)
    for(const h of acc.holdings)hold.push({...h,id:acc.kind+':'+h.sym,acct:acc.kind});
  let date='';
  const m=st.period&&st.period.match(/^(\w+) (\d+), (\d{4})$/);
  if(m){const mi=['January','February','March','April','May','June','July','August','September','October','November','December'].indexOf(m[1]);
    if(mi>=0)date=m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0')}
  return {hold,subs:st.accounts.map(x=>({kind:x.kind,total:x.total,
    n:x.holdings.filter(h=>!isCash(h)).length,cash:x.holdings.filter(isCash).reduce((t,h)=>t+h.v,0)})),date};
}

/* ---------- the map of everything held ----------
   One rectangle per security, its area its share of the money. Squarified: the algorithm lays a
   row across the shorter side and keeps adding to it while the worst aspect ratio in that row
   improves, which is what keeps the tiles close to square and therefore readable. */
function squarify(items,x,y,w,h,out){
  if(!items.length)return out;
  const sum=a=>a.reduce((n,i)=>n+i.v,0);
  const total=sum(items);
  if(total<=0||w<=0||h<=0)return out;
  /* work in units of area: one unit of value is (w*h/total) of pixel area */
  const scale=w*h/total;
  const sc=items.map(i=>({...i,a:i.v*scale}));
  let row=[],i=0;
  const place=(row,x,y,w,h,horiz)=>{
    const s=row.reduce((n,i)=>n+i.a,0),side=horiz?s/h:s/w;
    let off=0;
    for(const it of row){
      const len=it.a/side;
      out.push(horiz?{x,y:y+off,w:side,h:len,it}:{x:x+off,y,w:len,h:side,it});
      off+=len;
    }
    return side;
  };
  while(i<sc.length){
    const horiz=w<=h?false:true;        /* lay the row along the longer side */
    const len=horiz?h:w;
    const cand=[...row,sc[i]];
    const wr=(r)=>{const s=r.reduce((n,k)=>n+k.a,0),side=s/len;let bad=1;
      for(const it of r){const other=it.a/side;bad=Math.max(bad,Math.max(side/other,other/side))}return bad};
    const now=row.length?wr(row):Infinity;
    if(!row.length||wr(cand)<=now){row=cand;i++;continue}
    const side=place(row,x,y,w,h,horiz);
    if(horiz){x+=side;w-=side}else{y+=side;h-=side}
    row=[];
  }
  if(row.length)place(row,x,y,w,h,w<=h?false:true);
  return out;
}
let treeBy='sec';        /* sec: one tile per security · cat: grouped by kind · acc: by account */
function treemapBody(){
  const hs=allHoldings();
  if(hs.length<2)return `<div class="empty"><h2>אין מספיק אחזקות</h2><p>המפה נבנית מקובצי האחזקות של כל החשבונות. אחרי שמעלים קובץ אחד לפחות היא תופיע כאן.</p></div>`;
  const tot=hs.reduce((n,h)=>n+h.ils,0);
  const groups={
    sec:()=>hs.map(h=>({k:h.id+'|'+h.acc.id,label:isCash(h)?'מזומן':dispName(h),sub:h.where,v:h.ils,
      col:catCol(catOf(h)),hollow:catHollow(catOf(h)),full:(isCash(h)?'מזומן':h.name)+' · '+h.where,cash:isCash(h)})),
    cat:()=>CATS.map(([k,l])=>({k,label:l,sub:'',v:hs.filter(h=>catOf(h)===k).reduce((n,h)=>n+h.ils,0),col:catCol(k),hollow:catHollow(k)})).filter(g=>g.v>0),
    acc:()=>visAcc().map(a=>({k:a.id,label:a.short,sub:'',v:hs.filter(h=>h.acc.id===a.id).reduce((n,h)=>n+h.ils,0),col:acol(a.color)})).filter(g=>g.v>0)
  };
  const items=groups[treeBy]().filter(g=>g.v>0).sort((a,b)=>b.v-a.v);
  const W=100,H=treeBy==='sec'?118:76;      /* a percentage box, so it fills whatever width it gets */
  const tiles=squarify(items.map(g=>({v:g.v,g})),0,0,W,H,[]);
  const fmtp=v=>(v/tot*100);
  let h=`<div class="pagehead" style="padding-top:6px"><h1>מפת האחזקות</h1><p>שטח כל מלבן הוא חלקו מתוך <span class="n">${ils(tot)}</span></p></div>
  <section><div class="segbar" role="tablist">${[['sec','לפי נייר'],['cat','לפי סוג'],['acc','לפי חשבון']].map(([k,t])=>`<button role="tab" data-tree="${k}" aria-selected="${k===treeBy}">${t}</button>`).join('')}</div>
  <div class="treewrap" style="--ar:${(H/W*100).toFixed(2)}%">`;
  for(const t of tiles){
    const g=t.it.g,p=fmtp(g.v);
    const small=t.w<13||t.h<9;
    h+=`<button class="tile" data-tile="${esc(g.k)}"${g.cash?' data-cash="1"':''} style="left:${t.x.toFixed(3)}%;top:${(t.y/H*100).toFixed(3)}%;width:${t.w.toFixed(3)}%;height:${(t.h/H*100).toFixed(3)}%;--tc:${g.col}${g.hollow?';--ho:1':''}" title="${esc((g.full||g.label)+' · '+ils(g.v))}">
      ${small?'':`<span class="tl-n">${esc(short(g.label,Math.max(4,Math.round(t.w/2.6))))}</span><span class="tl-p n">${p.toFixed(p<1?1:0)}%</span>`}</button>`;
  }
  h+=`</div></section>`;
  // the long tail, in words
  if(treeBy==='sec'){
    const big=hs.filter(x=>!isCash(x)).slice(0,8);
    h+=`<section><h2>הגדולים ביותר</h2><div class="panel">`;
    for(const x of big)h+=`<div class="row dotted">${dot(catOf(x))}<span><span class="nm">${esc(short(dispName(x)))}</span><div class="sub">${esc(x.where)}</div></span><span class="val"><b>${ils(x.ils)}</b><span class="n flat">${(x.ils/tot*100).toFixed(1)}%</span></span></div>`;
    h+=`</div></section>`;
  }
  return h;
}
/* Exposure and concentration are about the whole portfolio rather than two dates, so they live
   on a page of their own, reached from the overview. */
function spreadBody(){
  let h=`<div class="pagehead" style="padding-top:6px"><h1>פיזור וחשיפה</h1><p>כל החשבונות יחד, לפי העדכון האחרון</p></div>`;
  /* ---- what is not in shekels ---- */
  const fx=fxExposure();
  if(fx&&fx.total>0&&fx.fx>0){
    const share=fx.fx/fx.total*100;
    h+=`<section><h2>חשיפה מטבעית</h2><div class="panel"><div class="pad"><div class="stack" role="img" aria-label="חשיפה למטבע חוץ ${share.toFixed(0)}%">
      <i style="flex:${fx.total-fx.fx} 0 0;background:${acol('#2F9E6E')}"></i><i style="flex:${fx.fx} 0 0;background:${acol('#3B82F6')}"></i></div></div>
      <div class="row dotted"><span class="spine" style="background:${acol('#2F9E6E')}"></span><span class="nm">שקל</span><span class="val"><b>${ils(fx.total-fx.fx)}</b><span class="n flat">${(100-share).toFixed(1)}%</span></span></div>
      <div class="row dotted"><span class="spine" style="background:${acol('#3B82F6')}"></span><span><span class="nm">מטבע חוץ</span><div class="sub">${Object.keys(fx.by).map(id=>esc((ACCOUNTS.find(a=>a.id===id)||{}).short||'')).join(' · ')}</div></span><span class="val"><b>${ils(fx.fx)}</b><span class="n flat">${share.toFixed(1)}%</span></span></div>
      </div></section>`;
  }
  /* ---- equities, bonds and cash, and where the equities are listed ----
     a fund is equity too, so what matters for this answer is the market it tracks, not whether
     it is a share or a basket of shares */
  const hsa=allHoldings();
  if(hsa.length){
    const tot=hsa.reduce((n,x)=>n+x.ils,0);
    const sum=f=>hsa.filter(f).reduce((n,x)=>n+x.ils,0);
    const isEq=x=>['stock','fund'].includes(ptypeOf(x));
    const eqIl=sum(x=>isEq(x)&&eqMarket(x)==='il'),eqIntl=sum(x=>isEq(x)&&eqMarket(x)!=='il');
    const bond=sum(x=>ptypeOf(x)==='bond'),cash=sum(isCash);
    const eq=eqIl+eqIntl;
    const pc=v=>tot?(v/tot*100):0;
    const parts=[[eqIl,catCol('stock-il'),false],[eqIntl,catCol('stock-intl'),true],[bond,catCol('bond'),false],[cash,catCol('cash'),false]];
    const row=(lbl,sub,v,c,hollow,ind)=>`<div class="row dotted${ind?' ind':''}"><span class="spine${hollow?' hollow':''}" style="--c:${c};background:${c}"></span><span><span class="nm"${ind?' style="font-weight:400"':''}>${lbl}</span>${sub?`<div class="sub">${sub}</div>`:''}</span><span class="val"><b>${ils(v)}</b><span class="n flat">${pc(v).toFixed(1)}%</span></span></div>`;
    h+=`<section><h2>לפי סוג נכס</h2><div class="panel"><div class="pad"><div class="stack" role="img" aria-label="מנייתי ${pc(eq).toFixed(0)}%, אג״ח ${pc(bond).toFixed(0)}%, מזומן ${pc(cash).toFixed(0)}%">${
      parts.filter(([v])=>v>0).map(([v,c,ho])=>`<i style="flex:${v} 0 0;background:${c}${ho?';opacity:.55':''}"></i>`).join('')}</div></div>
      ${eq>0?row('מנייתי','מניות וקרנות סל',eq,catCol('stock-il'),false,false):''}
      ${eqIl>0?row('ישראלי','',eqIl,catCol('stock-il'),false,true):''}
      ${eqIntl>0?row('אמריקאי וחו״ל','',eqIntl,catCol('stock-intl'),true,true):''}
      ${bond>0?row('אג״ח','',bond,catCol('bond'),false,false):''}
      ${cash>0?row('מזומן','',cash,catCol('cash'),false,false):''}
    </div></section>`;
  }
  /* ---- how much of everything sits in a few names ---- */
  const hs=allHoldings().filter(h=>!isCash(h));
  if(hs.length>2){
    const tot=hs.reduce((n,h)=>n+h.ils,0);
    const top=hs.slice(0,5);
    const t5=top.reduce((n,h)=>n+h.ils,0);
    h+=`<section><h2>ריכוזיות <small>כל החשבונות יחד</small></h2><div class="panel">
    ${top.map(x=>`<div class="row dotted">${dot(catOf(x))}<span><span class="nm">${esc(short(dispName(x)))}</span><div class="sub">${esc(x.where)}${x.sym&&x.sym.toUpperCase()!==dispName(x).toUpperCase()?' · <span class="n">'+esc(x.sym)+'</span>':''}</div></span><span class="val"><b>${ils(x.ils)}</b><span class="n flat">${(x.ils/tot*100).toFixed(1)}%</span></span></div>`).join('')}
    </div><div class="panel facts" style="margin-top:10px">
    <div><small>5 הגדולות מתוך ניירות הערך</small><b class="n">${(t5/tot*100).toFixed(1)}%</b></div>
    <div><small>הגדולה ביותר</small><b class="n">${(hs[0].ils/tot*100).toFixed(1)}%</b></div>
    <div><small>מספר ניירות</small><b class="n">${hs.length}</b></div></div>
    <div class="stackbtns" style="margin-top:10px"><button class="btn ghost" data-act="treemap">מפת כל האחזקות</button></div></section>`;
  }
  const hsx=allHoldings().filter(x=>!isCash(x));
  if(!hsx.length&&!fxExposure())h+=`<div class="empty"><h2>אין עדיין נתונים</h2><p>אחרי העלאת קובץ אחזקות אחד לפחות אפשר יהיה לראות כאן את הפיזור והחשיפה.</p></div>`;
  return h;
}

/* ---------- drag sideways between the four pages ----------
   the neighbour is built once, at the moment the drag is recognised, and then both pages ride
   the finger on one spring. letting go hands the spring the finger's speed, so a flick lands
   where it was thrown and a slow drag settles back. */
const tabSwipe={busy:false};
(function tabPager(){
  const app=$('#app');
  let armed=false,on=false,sx=0,sy=0,pid=0,vt=null,dirn=0,ghost=null,W=1,eat=false;
  /* a sideways drag is never a tap, even when there is no page to move to */
  addEventListener('click',e=>{if(eat){eat=false;e.preventDefault();e.stopPropagation()}},true);
  let pending=null;
  /* putting a finger down while the last page is still coasting finishes it there and then,
     so a second swipe never waits for the first to stop moving */
  const finishNow=()=>{
    if(!pending)return;
    const go=pending.go;pending=null;sp.stop();
    const next=go?TABS[TABS.indexOf(tab)+dirn]:null;
    cleanup();
    /* an abandoned drag moved nothing but a transform, so there is no scroll to put back */
    if(next){tab=next;shownTab=next;render();window.scrollTo(0,0)}
  };
  const canStart=()=>!stack.length&&!document.querySelector('.lock')&&!tabSwipe.busy&&TABS.includes(tab);
  const place=u=>{
    const x=u*W;
    view.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
    if(ghost)ghost.style.transform=`translate3d(${(x-dirn*W).toFixed(2)}px,0,0)`;
  };
  const sp=Spring(place);
  const cleanup=()=>{
    if(ghost){ghost.remove();ghost=null}
    view.style.transform='';view.style.willChange='';
    tabSwipe.busy=false;
  };
  addEventListener('pointerdown',e=>{
    if(pending)finishNow();
    if(!canStart())return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('.sheet,input,select,textarea,.chiprow,.segbar'))return;
    armed=true;on=false;eat=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
  },{passive:true});
  addEventListener('pointermove',e=>{
    if(!armed||e.pointerId!==pid)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!on){
      if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){armed=false;return}
      if(Math.abs(dx)<14)return;
      /* in a right-to-left bar the next page sits to the left, so dragging left advances */
      const step=dx>0?1:-1;
      const want=TABS.indexOf(tab)+step;
      if(want<0||want>=TABS.length){armed=false;eat=true;return}
      on=true;tabSwipe.busy=true;eat=true;
      W=innerWidth;dirn=step;
      ghost=pageCache[TABS[want]]||buildPage(TABS[want]);
      delete pageCache[TABS[want]];
      /* a fixed overlay, so bringing it in moves nothing that was already laid out */
      ghost.style.cssText='position:fixed;inset:0;overflow:hidden;z-index:3;background:var(--bg);will-change:transform';
      view.style.willChange='transform';
      document.body.appendChild(ghost);
      sp.jump(0);place(0);
      vt=Velocity();vt.add(e.clientX);
      try{app.setPointerCapture(pid)}catch(err){}
    }
    vt.add(e.clientX);
    let x=dx;
    if(dirn>0&&x<0)x=rubber(x,W);
    if(dirn<0&&x>0)x=rubber(x,W);
    sp.jump(x/W);
  },{passive:true});
  const release=()=>{
    if(!armed)return;armed=false;
    if(!on)return;
    on=false;
    const v=vt?vt.get():0,land=sp.value+project(v)/W*.35;
    const go=dirn>0?land>.3:land<-.3;
    const target=go?dirn:0;
    pending={go};
    sp.to(target,{damping:1,response:go?.22:.26,velocity:Math.max(-8,Math.min(8,v/W))},finishNow);
  };
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
})();

/* ---------- pull down for the rate ----------
   the page itself gives under the finger and resists further the further it goes, which is the
   same rubber the sheets use. letting go past the mark fetches today's rate. */
(function pullToRefresh(){
  const ind=$('#pull'),app=$('#app'),txt=ind.querySelector('.txt');
  const TRIG=62;let y0=null,on=false,busy=false,pid=0;
  const sp=Spring(y=>{
    app.style.transform=y?`translateY(${y.toFixed(1)}px)`:'';
    ind.style.opacity=Math.min(1,y/38).toFixed(2);
    ind.style.transform=`translateY(${(Math.min(y,TRIG)-30).toFixed(1)}px)`;
  },TRIG);
  const atTop=()=>(document.scrollingElement||document.documentElement).scrollTop<=0;
  addEventListener('pointerdown',e=>{
    if(busy||stack.length||tabSwipe.busy||document.querySelector('.lock')||e.pointerType==='mouse'&&e.button!==0)return;
    if(!atTop())return;
    y0=e.clientY;on=false;pid=e.pointerId;
  },{passive:true});
  addEventListener('pointermove',e=>{
    if(y0===null||e.pointerId!==pid||busy||tabSwipe.busy)return;
    const dy=e.clientY-y0;
    if(!on){if(dy<10||!atTop()){if(dy<-6)y0=null;return}on=true;sp.stop()}
    sp.jump(rubber(Math.max(0,dy),innerHeight*.9));
  },{passive:true});
  const release=async()=>{
    if(y0===null)return;const was=on;y0=null;on=false;
    if(!was)return;
    if(sp.value<TRIG*.8){sp.to(0,{damping:1,response:.4});return}
    busy=true;ind.classList.add('go');txt.textContent='';
    sp.to(TRIG,{damping:1,response:.36});
    const recs=refreshRecs(false,RECSOON,5000).catch(()=>0);   /* alongside the rate, not after it */
    let head='';
    try{
      const r=await Promise.race([fetchRate(today()),
        new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),6000))]);  /* don't hang on a dead connection */
      liveRate=r.rate;liveAt=Date.now();
      head='₪'+r.rate.toFixed(3);
      const el=$('#liverate');if(el){el.textContent='₪'+r.rate.toFixed(3);el.classList.remove('flat')}
    }catch(e){head='לא זמין'}
    txt.textContent=head;
    ind.classList.remove('go');
    setTimeout(()=>{sp.to(0,{damping:1,response:.42});busy=false;setTimeout(()=>{txt.textContent=''},300)},850);
    /* the page comes back up at the rate's pace; the consensus lands when it lands */
    const n=await recs;
    if(n)toast(n===1?'המלצה אחת עודכנה':n+' המלצות עודכנו');
  };
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
})();

(function boot(){
  const raw=readRaw();
  if(raw&&raw.enc){lockScreen();return}
  if(raw&&raw.data){setConfig(raw.data.accounts);S.updates=clean(raw.data.updates);loadPorts(raw.data,true)}
  start();
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  for(const k in colCache)delete colCache[k];
  if(cryptoKey||!readRaw()||!readRaw().enc)render();
});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
