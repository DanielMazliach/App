<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מעקב כספים">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>מעקב כספים</title>
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#0E2233; --ink2:#44566A; --muted:#62717F; --line:#DCE3E8;
  --up:#17713F; --down:#B8322A; --focus:#1D6FD8; --tint:#1D6FD8; --ease:cubic-bezier(.32,.72,0,1);
  --num: ui-rounded, "SF Pro Rounded", -apple-system, "SF Hebrew", "Arial Hebrew", Arial, sans-serif;
  --txt: -apple-system, "SF Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink)}
body{font-family:var(--txt);color:var(--ink);font-size:17px;line-height:1.38;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
[hidden]{display:none!important}

#app{min-height:100%;background:var(--bg);padding-bottom:calc(72px + var(--sab))}
.view{max-width:560px;margin:0 auto}

/* hero */
.hero{background:var(--ink);color:#F3F6F8;padding:calc(var(--sat) + 18px) 20px 14px;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-size:15px;font-weight:600;color:#A9B8C5}
.hero .total{font-family:var(--num);font-size:44px;font-weight:700;letter-spacing:-.022em;line-height:1.1;margin:6px 0 2px;direction:ltr;text-align:right}
.hero .asof{font-size:13px;color:#A9B8C5}
.hero .deltas{display:flex;gap:10px;margin:14px 0 6px}
.hero .deltas div{flex:1;background:#18304560;border:1px solid #2A4257;border-radius:14px;padding:9px 12px}
.hero .deltas small{display:block;font-size:12px;color:#A9B8C5}
.hero .deltas b{font-family:var(--num);font-size:17px;direction:ltr;display:inline-block}
.hero .up{color:#6FD69B} .hero .down{color:#FF9A8F} .hero .flat{color:#A9B8C5}
.readout{font-size:12.5px;min-height:18px;color:var(--muted);margin:2px 0 0}
.hero .readout{color:#A9B8C5}

.pagehead{background:var(--ink);color:#F3F6F8;padding:calc(var(--sat) + 18px) 20px 18px;border-radius:0 0 28px 28px}
.pagehead h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.018em;line-height:1.15}
.pagehead p{margin:4px 0 0;font-size:14px;color:#A9B8C5}

section{margin:22px 16px 0}
section>h2{font-size:20px;font-weight:700;letter-spacing:-.012em;line-height:1.2;margin:0 4px 10px}
section>h2 small{font-weight:400;font-size:13px;color:var(--muted);margin-inline-start:6px}
.panel{background:var(--surface);border-radius:16px;overflow:hidden}
.pad{padding:14px 16px}

/* composition bar */
.stack{display:flex;gap:2px;height:14px;direction:ltr;margin:2px 0 4px}
.stack i{display:block;height:100%;min-width:3px;border-radius:3px}
.stack i:first-child{border-radius:7px 3px 3px 7px}.stack i:last-child{border-radius:3px 7px 7px 3px}

/* ledger rows */
.row{display:grid;grid-template-columns:5px 1fr auto;gap:0 12px;transition:background .07s ease-out;align-items:center;width:100%;text-align:start;padding:13px 16px 13px 14px;border-top:1px solid var(--line);background:var(--surface)}
.row:first-child{border-top:0}
.row .spine{align-self:stretch;border-radius:3px}
.row .nm{font-weight:600;font-size:15.5px}
.row .sub{font-size:13px;color:var(--muted);margin-top:1px}
.row .val{text-align:left}
.row .val b{font-family:var(--num);font-size:16.5px;font-weight:700;display:block;direction:ltr}
.row .val span{font-size:13px}
button.row{grid-template-columns:5px 1fr auto 9px}
button.row:active{background:#E9EEF2}
.row .chev{width:9px;height:15px;fill:none;stroke:#B4BFC8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.bars .br{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 16px;border-top:1px solid var(--line)}
.bars .br:first-child{border-top:0}
.bars .track{grid-column:1/-1;height:8px;background:#EDF1F4;border-radius:4px;direction:ltr;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--ink2);border-radius:4px;min-width:2px}
.bars .lbl{font-size:14.5px}.bars .v{font-size:14.5px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.facts div{background:var(--surface);padding:12px 16px}
.facts small{display:block;color:var(--muted);font-size:12.5px}
.facts b{font-family:var(--num);font-size:17px;direction:ltr;display:inline-block}

.note{font-size:13.5px;color:var(--ink2);background:#FFF6DA;border-radius:14px;padding:11px 14px;margin:16px 16px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note button{font-weight:700;text-decoration:underline;white-space:nowrap}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16.5px;padding:0 18px;letter-spacing:-.005em}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--down);border:1px solid #EBC9C6}
.btn{transition:transform .09s ease-out,opacity .09s ease-out}
.btn:active{opacity:.82;transform:scale(.975)}
.btn[disabled]{opacity:.45}
.stackbtns{display:grid;gap:10px}

/* tabbar */
.tabbar{position:fixed;inset:auto 0 0 0;background:#FFFFFFF2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
.tabbar div{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;height:56px;font-size:11px;color:#8B98A4;transition:color .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}

/* pages: a detail page pushes in from the side, a form rises as a card */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;will-change:transform}
.sheet header{background:#F6F8F9D9;backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);border-bottom:1px solid transparent;transition:border-color .2s,background .2s;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 12px 6px;min-height:calc(var(--sat) + 50px)}
.sheet header h2{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet header button{color:var(--tint);font-size:17px;min-height:38px;padding:0 6px;justify-self:start;display:flex;align-items:center;gap:2px}
.sheet header button:active{opacity:.45}
.sheet header button svg{width:12px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--sab))}
.sheet footer{background:#FFFFFFEE;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sab));display:flex;align-items:center;gap:14px}
.sheet footer .sum{flex:1}
.sheet footer .sum small{display:block;color:var(--muted);font-size:12px}
.sheet footer .sum b{font-family:var(--num);font-size:21px;direction:ltr;display:inline-block}
.sheet footer .btn{width:auto;min-width:130px}
.sheet.modal{top:calc(var(--sat) + 10px);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -1px 40px #06121D33}
.sheet.modal header{padding-top:16px;min-height:58px}
.sheet header.edge{border-bottom-color:var(--line)}
.acc-head{padding:18px 20px 4px}
.acc-head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.acc-head .big{font-family:var(--num);font-size:38px;font-weight:700;letter-spacing:-.022em;direction:ltr;text-align:right;margin-top:10px;line-height:1.1}
.acc-head .meta{color:var(--muted);font-size:14.5px;margin-top:2px}
.chips{display:flex;gap:10px;margin:16px 16px 0}
.chips div{flex:1;background:var(--surface);border-radius:16px;padding:11px 14px}
.chips small{display:block;font-size:12.5px;color:var(--muted)}
.chips b{font-family:var(--num);font-size:18px;direction:ltr;display:inline-block}
.chips span{font-size:13.5px}
/* every surface the finger can reach is driven by a spring in JS, so it can be grabbed mid-flight */
.sheet{touch-action:pan-y;will-change:transform}
.sheet.modal header{touch-action:none}
#scrim{position:fixed;inset:0;background:#06121D;opacity:0;z-index:9;pointer-events:none}
#app,#tabbar{will-change:transform}
.grab{position:absolute;top:6px;left:0;right:0;height:5px;margin:0 auto;width:38px;border-radius:3px;background:#C3CCD4}
@media (prefers-reduced-transparency:reduce){
  .tabbar,.sheet header,.sheet footer{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
@media (prefers-contrast:more){
  :root{--line:#9AA8B4;--muted:#44566A}
  .panel,.chips div,.facts div{outline:1px solid var(--line);outline-offset:-1px}
}
@media (prefers-reduced-motion:no-preference){
  .view.fade{animation:tabin .26s ease-out}
  @keyframes tabin{from{opacity:0;transform:translateY(6px)}}
  svg.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .12s var(--ease) forwards}
  svg.chart .pop{opacity:0;animation:pop .35s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  svg.chart circle{transform-box:fill-box;transform-origin:center}
  .toast{animation:toastin .3s var(--ease)}
  @keyframes toastin{from{opacity:0;transform:translateY(10px)}}
}

.grp{margin:16px 16px 0;background:var(--surface);border-radius:18px;overflow:hidden;border-inline-start:5px solid var(--c,var(--ink))}
.grp h3{margin:0;padding:12px 16px 4px;font-size:15.5px}
.grp h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:6px}
.fld{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;padding:7px 16px;border-top:1px solid var(--line)}
.grp h3 + .fld{border-top:0}
.fld label{font-size:15px}
.fld label small{display:block;color:var(--muted);font-size:12px;direction:rtl}
.fld input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-family:var(--num);font-size:17px;direction:ltr;text-align:right;background:#FAFBFC;font-variant-numeric:tabular-nums}
.fld input:focus{border-color:var(--focus);background:#fff;outline:0;box-shadow:0 0 0 3px #1D6FD822}
.fld input[type=date]{text-align:right;-webkit-appearance:none;appearance:none}
.fld .inl{display:flex;gap:8px}
.fld .inl button{white-space:nowrap;font-size:13.5px;font-weight:700;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
.hint{font-size:12.5px;color:var(--muted);padding:4px 16px 10px}
.err{margin:14px 16px 0;background:#FDECEA;color:#8E211A;border-radius:12px;padding:10px 14px;font-size:14px}

table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:left;padding:10px 8px 6px}
table.cmp th:first-child,table.cmp td:first-child{text-align:right;padding-inline-start:16px}
table.cmp td{padding:10px 8px;border-top:1px solid var(--line);text-align:left}
table.cmp td:last-child,table.cmp th:last-child{padding-left:16px}
table.cmp tr.tot td{font-weight:700;background:#F6F8FA}
table.cmp .d small{display:block;font-size:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{font-size:12.5px;color:var(--muted);display:block}
.pick select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;font-size:16px;margin-top:4px}
.empty{text-align:center;padding:40px 24px;color:var(--ink2)}
.empty h2{font-size:20px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 18px}
.lock{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
.lock h1{font-size:24px;margin:0}
.lock p{margin:0;color:#A9B8C5;font-size:15px;text-align:center}
.lock input{width:220px;height:54px;border-radius:14px;border:1px solid #2A4257;background:#18304580;color:#fff;font-size:22px;text-align:center;direction:ltr}
.lock .btn{background:#fff;color:var(--ink);width:220px}
.lock .msg{color:#FF9A8F;min-height:20px;font-size:14px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;direction:ltr;font-family:ui-monospace,Menlo,monospace}
svg.chart{display:block;width:100%;height:auto;touch-action:pan-y;direction:ltr}
svg.chart text{font-family:var(--num);font-size:10.5px;fill:var(--muted)}
.hero svg.chart text{fill:#A9B8C5}
svg.spark{width:60px;height:22px;direction:ltr}
.toast{position:fixed;inset:auto 16px calc(84px + var(--sab)) 16px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;text-align:center;z-index:30;font-size:15px;max-width:520px;margin:0 auto}
</style>
</head>
<body>
<div id="app"><div class="view" id="view"></div></div>
<div id="scrim" aria-hidden="true"></div>
<nav class="tabbar" id="tabbar" hidden><div>
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>סקירה</button>
  <button data-tab="updates"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>עדכונים</button>
  <button data-tab="compare"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>השוואה</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>הגדרות</button>
</div></nav>
<div id="layer"></div>
<script>
'use strict';
/* ---------- model ---------- */
/* accounts are not part of the code: they arrive with the backup file and live only on the device */
let ACCOUNTS=[],FIELDS=[];
function setConfig(list){const ok=[];for(const a of Array.isArray(list)?list:[]){if(!a||!a.id||!Array.isArray(a.fields))continue;ok.push({id:String(a.id),name:String(a.name||a.id),short:String(a.short||a.name||a.id),color:/^#[0-9a-f]{6}$/i.test(a.color)?a.color:'#44566A',cur:a.cur==='USD'?'USD':'ILS',fields:a.fields.filter(f=>Array.isArray(f)&&f[0]).map(f=>[String(f[0]),String(f[1]||f[0]),['cur','fx','cap','sav'].includes(f[2])?f[2]:'cap',!!f[3]])})}ACCOUNTS=ok;FIELDS=ok.flatMap(a=>a.fields.map(f=>f[0]))}
const ASSETS=[['cur','עו״ש'],['fx','עו״ש מט״ח'],['cap','שוק ההון / קרנות'],['sav','חיסכון, פיקדונות ו-IRA']];
const KEY='ft.data.v1', META='ft.meta.v1';
let S={updates:[]}, cryptoKey=null, encMeta=null, tab='home';

const num=v=>{const x=typeof v==='number'?v:parseFloat(String(v??'').replace(/[,\s₪$]/g,''));return Number.isFinite(x)?x:0};
function calc(u){
  const r={acc:{},usdAcc:{},asset:{cur:0,fx:0,cap:0,sav:0},total:0,usd:0};
  for(const a of ACCOUNTS){let s=0;for(const [k,,t] of a.fields){const m=a.cur==='USD'?num(u.rate):1;const v=num(u.vals[k])*m;s+=v;r.asset[t]+=v;if(a.cur==='USD'){r.usd+=num(u.vals[k]);r.usdAcc[a.id]=(r.usdAcc[a.id]||0)+num(u.vals[k])}}r.acc[a.id]=s;r.total+=s}
  return r;
}
const sorted=()=>[...S.updates].sort((a,b)=>a.date<b.date?-1:1);

/* ---------- format ---------- */
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const ils=v=>'₪'+nf0.format(Math.round(v));
const usd=v=>'$'+nf0.format(Math.round(v));
const signed=v=>(v>0?'+':v<0?'−':'')+nf0.format(Math.abs(Math.round(v)));
const pct=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%';
const cls=v=>v>0.5?'up':v<-0.5?'down':'flat';
const arrow=v=>v>0.5?'▲':v<-0.5?'▼':'●';
const dshort=d=>{const [y,m,dd]=d.split('-');return +dd+'/'+ +m+'/'+y.slice(2)};
const dlong=d=>{const [y,m,dd]=d.split('-');return +dd+'/'+ +m+'/'+y};
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const compact=v=>{const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e4?(v/1e3).toFixed(a>=1e5?0:1)+'K':nf0.format(v)};

/* ---------- storage (optionally encrypted on device) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function readRaw(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function meta(){try{return JSON.parse(localStorage.getItem(META)||'{}')}catch(e){return {}}}
function setMeta(p){try{localStorage.setItem(META,JSON.stringify({...meta(),...p}))}catch(e){}}
let saveChain=Promise.resolve();
function save(){
  saveChain=saveChain.then(async()=>{
    const plain=JSON.stringify({v:2,accounts:ACCOUNTS,updates:S.updates});
    let out;
    if(cryptoKey){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(plain));out={enc:1,salt:encMeta.salt,iv:b64(iv),ct:b64(ct)}}
    else out={enc:0,data:JSON.parse(plain)};
    localStorage.setItem(KEY,JSON.stringify(out));
  }).catch(e=>toast('השמירה נכשלה: '+e.message));
  return saveChain;
}
async function unlock(pass){
  const raw=readRaw();const salt=unb64(raw.salt);const k=await deriveKey(pass,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},k,unb64(raw.ct));
  const d=JSON.parse(new TextDecoder().decode(pt));setConfig(d.accounts);S.updates=clean(d.updates);cryptoKey=k;encMeta={salt:raw.salt};
}
function clean(list){
  const out=[];const seen=new Set();
  for(const u of Array.isArray(list)?list:[]){
    if(!u||!/^\d{4}-\d{2}-\d{2}$/.test(u.date)||seen.has(u.date))continue;seen.add(u.date);
    const vals={};for(const k of FIELDS)vals[k]=num(u.vals&&u.vals[k]);
    out.push({date:u.date,vals,rate:num(u.rate)});
  }
  return out;
}

/* ---------- charts ---------- */
function niceTicks(lo,hi,n=4){
  if(lo===hi){const p=Math.abs(lo)*0.01||1;lo-=p;hi+=p}
  const pad=(hi-lo)*0.18;lo-=pad;hi+=pad;

/* line with point markers; y-axis hugs the data (a bit below the lowest, a bit above the highest) */
function lineChart(pts,color,o={}){
  const W=340,H=o.h||170,L=8,R=44,T=14,B=24,dark=!!o.dark;
  const vs=pts.map(p=>p.v);const {min,max,ticks}=niceTicks(Math.min(...vs),Math.max(...vs));const tf=tickFmt(ticks);
  const x=i=>pts.length===1?(L+(W-R-L)/2):L+10+i*(W-R-L-20)/(pts.length-1);const y=v=>T+(max-v)*(H-T-B)/(max-min);
  const grid=dark?'#2A4257':'#E6EBEF',ring=dark?'#0E2233':'#FFFFFF';
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'גרף')}">`;
  for(const t of ticks){s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${grid}" stroke-width="1"/><text x="${W-R+6}" y="${y(t)+3.5}">${tf(t)}</text>`}
  const step=Math.max(1,Math.ceil(pts.length/5));
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){if(i!==pts.length-1&&(pts.length-1-i)<step*0.6)return;s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${dshort(p.d)}</text>`}});
  s+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="${dark?'#6C8196':'#9AA8B4'}" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  if(pts.length>1)s+=`<polyline ${o.anim?'class="draw" pathLength="1"':''} fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`;
  const r=pts.length>30?0:pts.length>16?3:4.5;
  if(r)pts.forEach((p,i)=>{s+=`<circle ${o.anim?`class="pop" style="animation-delay:${(.25+.75*i/Math.max(pts.length-1,1)).toFixed(2)}s"`:''} cx="${x(i)}" cy="${y(p.v)}" r="${r}" fill="${color}" stroke="${ring}" stroke-width="2"/>`});
  s+=`<rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent" data-xs="${pts.map((p,i)=>x(i).toFixed(1)).join(',')}"/></svg>`;
  return s;
}
function spark(vs,color){if(vs.length<2)return '';const lo=Math.min(...vs),hi=Math.max(...vs),sp=hi-lo||1;
  const p=vs.map((v,i)=>(3+i*54/(vs.length-1)).toFixed(1)+','+(19-(v-lo)*16/sp).toFixed(1)).join(' ');
  const last=p.split(' ').pop().split(',');
  return `<svg class="spark" viewBox="0 0 60 22" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`}
function readoutText(p,prev,fmt){let t=`<span class="n">${dlong(p.d)}</span> · <b class="n">${fmt(p.v)}</b>`;if(prev){const d=p.v-prev.v;t+=` · <span class="n ${cls(d)}">${arrow(d)} ${signed(d)}</span>`}return t}
function wireChart(box,pts,fmt){
  const svg=box.querySelector('svg.chart'),out=box.querySelector('.readout');if(!svg||!out)return;
  const hit=svg.querySelector('.hit'),cross=svg.querySelector('.cross');const xs=hit.dataset.xs.split(',').map(Number);
  const show=i=>{out.innerHTML=readoutText(pts[i],pts[i-1],fmt)};

function findRate(j){let found=null;(function walk(o,key){if(found!==null||o==null)return;if(typeof o==='number'){if(o>=2&&o<=6&&(/rate|ils|value/i.test(key||'')))found=o;return}if(typeof o==='object')for(const k in o)walk(o[k],k)})(j,'');return found}
async function fetchRate(d){
  const srcs=[[`https://api.frankfurter.dev/v2/rate/usd/ils?date=${d}&providers=boi`,'יציג (בנק ישראל)'],[`https://api.frankfurter.dev/v1/${d}?base=USD&symbols=ILS`,'אירופי (ECB)']];
  for(const [url,src] of srcs){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),7000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(t);if(!r.ok)continue;const j=await r.json();const rate=findRate(j);
    if(rate)return {rate,src,date:(Array.isArray(j)?j[0]&&j[0].date:j.date)||d}}catch(e){}}
  throw new Error('no rate');
}

function viewCompare(){
  const U=sorted();let h=`<div class="pagehead"><h1>השוואה</h1><p>שני תאריכים, זה מול זה</p></div>`;
  if(U.length<2){view.innerHTML=h+`<div class="empty"><h2>צריך לפחות שני עדכונים</h2><p>אחרי העדכון השני אפשר יהיה להשוות ביניהם.</p><button class="btn" data-act="new">עדכון חדש</button></div>`;return}
  const st=viewCompare.st||(viewCompare.st={});if(!U.some(u=>u.date===st.a))st.a=U[U.length-2].date;if(!U.some(u=>u.date===st.b))st.b=U[U.length-1].date;
  const A=U.find(u=>u.date===st.a),B=U.find(u=>u.date===st.b),ca=calc(A),cb=calc(B);
  const opts=s=>U.map(u=>`<option value="${u.date}" ${u.date===s?'selected':''}>${dlong(u.date)}</option>`).join('');
  h+=`<section><div class="pick"><div><label for="ca">תאריך בסיס</label><select id="ca">${opts(st.a)}</select></div><div><label for="cb">תאריך להשוואה</label><select id="cb">${opts(st.b)}</select></div></div></section>`;
  const tbl=(title,rows)=>{let t=`<section><h2>${title}</h2><div class="panel"><table class="cmp"><thead><tr><th></th><th class="n">${dshort(A.date)}</th><th class="n">${dshort(B.date)}</th><th>שינוי</th></tr></thead><tbody>`;
    let sa=0,sb=0;for(const [nm,va,vb,col] of rows){sa+=va;sb+=vb;const d=vb-va;
      t+=`<tr><td>${col?`<span style="color:${col}">●</span> `:''}${nm}</td><td class="n">${compact(va)}</td><td class="n">${compact(vb)}</td><td class="d"><span class="n ${cls(d)}">${arrow(d)} ${signed(d)}</span><small class="n ${cls(d)}">${va?pct(d/va):''}</small></td></tr>`}
    const d=sb-sa;return t+`<tr class="tot"><td>סה״כ</td><td class="n">${compact(sa)}</td><td class="n">${compact(sb)}</td><td class="d"><span class="n ${cls(d)}">${arrow(d)} ${signed(d)}</span><small class="n ${cls(d)}">${sa?pct(d/sa,2):''}</small></td></tr></tbody></table></div></section>`};
  h+=tbl('לפי חשבון',ACCOUNTS.map(a=>[esc(a.short),ca.acc[a.id],cb.acc[a.id],a.color]));
  h+=`<section><div class="panel facts"><div><small>ימים בין התאריכים</small><b>${Math.round((new Date(B.date)-new Date(A.date))/864e5)}</b></div><div><small>שער דולר</small><b>${A.rate?A.rate.toFixed(3):'—'} → ${B.rate?B.rate.toFixed(3):'—'}</b></div></div></section>`;
  view.innerHTML=h;
  $('#ca').onchange=e=>{st.a=e.target.value;viewCompare()};$('#cb').onchange=e=>{st.b=e.target.value;viewCompare()};
}

/* ---------- backup ---------- */
async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true;
}
async function doBackup(){if(!S.updates.length){toast('אין עדיין נתונים לגיבוי');return}
  const ok=await shareFile(`finance-backup-${today()}.json`,JSON.stringify({app:'finance-tracker',v:2,exported:new Date().toISOString(),accounts:ACCOUNTS,updates:sorted()},null,1),'application/json');
  if(ok){setMeta({lastBackup:Date.now()});toast('הגיבוי נוצר');render()}}
async function doCsv(){if(!S.updates.length){toast('אין עדיין נתונים לייצוא');return}
  const head=['תאריך',...ACCOUNTS.flatMap(a=>a.fields.map(f=>a.short+' – '+f[1])),'שער דולר','סה״כ הון (₪)'];
  const rows=sorted().map(u=>[dlong(u.date),...FIELDS.map(k=>u.vals[k]),u.rate,Math.round(calc(u).total*100)/100]);
  await shareFile(`finance-${today()}.csv`,'﻿'+[head,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');}

  openLayer(`<div class="sheet modal" role="dialog" aria-label="טעינת גיבוי"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>טעינת גיבוי</h2><span></span></header><div class="body">

  const run=async txt=>{try{const j=JSON.parse(txt);if(Array.isArray(j.accounts)&&j.accounts.length)setConfig(j.accounts);if(!ACCOUNTS.length)throw 0;S.updates=clean(S.updates);const list=clean(j.updates);if(!list.length&&!S.updates.length&&!j.accounts)throw 0;
      const map=new Map(S.updates.map(u=>[u.date,u]));list.forEach(u=>map.set(u.date,u));S.updates=[...map.values()];await save();closeLayer();tab='home';render();toast('נטענו '+list.length+' עדכונים')}
    catch(e){const el=$('#ierr');el.textContent='הקובץ אינו גיבוי תקין של האפליקציה.';el.hidden=false}};

const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
/* A spring, not a timed animation: it starts from wherever the surface is right now and
   carries the finger's velocity, so a page can be grabbed and reversed mid-flight. */
function Spring(set){
  let x=0,v=0,t=0,z=1,r=.4,raf=0,last=0,cb=null;
  const step=now=>{
    let dt=(now-last)/1000;last=now;if(dt>1/20)dt=1/20;if(dt<=0)dt=1/60;
    const w=2*Math.PI/r,k=w*w,c=2*z*w,n=Math.max(1,Math.ceil(dt*360)),h=dt/n;
    for(let i=0;i<n;i++){v+=(-k*(x-t)-c*v)*h;x+=v*h}
    if(Math.abs(x-t)<4e-4&&Math.abs(v)<4e-3){x=t;v=0;set(x);raf=0;const f=cb;cb=null;if(f)f();return}
    set(x);raf=requestAnimationFrame(step);
  };
  const api={
    get value(){return x},get velocity(){return v},
    jump(val){if(raf)cancelAnimationFrame(raf);raf=0;x=val;v=0;set(x)},
    to(target,o,done){o=o||{};t=target;
      if(o.damping!=null)z=o.damping;if(o.response!=null)r=o.response;if(o.velocity!=null)v=o.velocity;
      cb=done||null;
      if(calm()){api.stop();x=t;v=0;set(x);if(done)done();return}
      if(!raf){last=performance.now();raf=requestAnimationFrame(step)}},
    stop(){if(raf)cancelAnimationFrame(raf);raf=0;cb=null}
  };
  return api;
}
const project=(v,d=.998)=>v/1000*d/(1-d);               // where a flick is heading
const rubber=(o,dim,c=.55)=>o*dim*c/(dim+c*Math.abs(o)); // resist, never stop dead
function Velocity(){const h=[];return{add(p){const t=performance.now();h.push([p,t]);
  while(h.length>6||(h.length>2&&t-h[0][1]>110))h.shift()},
  get(){if(h.length<2)return 0;const a=h[0],b=h[h.length-1],dt=(b[1]-a[1])/1000;return dt>.004?(b[0]-a[0])/dt:0}}}

let page=null;
function stage(p,kind){
  const app=$('#app'),tb=$('#tabbar'),sc=$('#scrim');
  if(kind==='push'){const tx=`translateX(${(p*22).toFixed(2)}%)`;app.style.transform=tx;tb.style.transform=tx;sc.style.opacity=(p*.13).toFixed(3)}
  else sc.style.opacity=(p*.42).toFixed(3);
}
function clearStage(){const app=$('#app'),tb=$('#tabbar');app.style.transform='';tb.style.transform='';$('#scrim').style.opacity=0}
function openLayer(html,push){
  if(page){page.s.stop();if(page.el.parentNode)page.el.remove();page=null}
  layer.innerHTML=html;
  const el=layer.firstElementChild;if(!el)return;
  const kind=push?'push':'modal';
  const set=p=>{el.style.transform=kind==='push'?`translateX(${(-(1-p)*100).toFixed(3)}%)`:`translateY(${((1-p)*100).toFixed(3)}%)`;stage(p,kind)};
  const s=Spring(set);s.jump(0);
  page={el,kind,s,set};
  s.to(1,kind==='push'?{damping:1,response:.42}:{damping:.86,response:.38});
  grab(el,kind,s,set);
  const body=el.querySelector('.body'),head=el.querySelector('header');
  if(body&&head)body.addEventListener('scroll',()=>head.classList.toggle('edge',body.scrollTop>2),{passive:true});
}
function closeLayer(vel){
  if(!page)return;
  const {el,s,kind}=page;page=null;
  s.to(0,{damping:1,response:kind==='push'?.36:.34,velocity:vel||0},()=>{if(el.parentNode)el.remove();clearStage()});
}
/* edge-swipe back on a pushed page; drag-down on a sheet. 1:1 with the finger, then momentum. */
function grab(el,kind,s,set){
  const area=kind==='push'?el:el.querySelector('header');if(!area)return;
  let armed=false,on=false,sx=0,sy=0,start=0,base=0,vt=null,pid=0;
  const dim=()=>kind==='push'?innerWidth:(el.offsetHeight||innerHeight);
  area.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(kind==='push'&&e.clientX<innerWidth-28)return;
    armed=true;on=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
  });
  area.addEventListener('pointermove',e=>{
    if(!armed||e.pointerId!==pid)return;
    const x=e.clientX,y=e.clientY;
    if(!on){
      const dx=Math.abs(x-sx),dy=Math.abs(y-sy);
      if(kind==='push'){if(dy>10&&dy>dx){armed=false;return}if(dx<8)return}
      else {if(dx>10&&dx>dy){armed=false;return}if(dy<6)return}
      on=true;start=kind==='push'?x:y;base=s.value;s.stop();
      vt=Velocity();vt.add(start);
      try{area.setPointerCapture(pid)}catch(err){}
    }
    const now=kind==='push'?x:y,d=now-start;
    vt.add(now);
    let p=base+(kind==='push'?d/dim():-d/dim());
    if(p>1)p=1+rubber(p-1,1);
    if(p<0)p=0;
    s.jump(p);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  const end=e=>{
    if(!armed||e.pointerId!==pid)return;armed=false;
    if(!on)return;on=false;
    const toOpen=vt.get()*(kind==='push'?1:-1),D=dim();
    const projected=s.value+project(toOpen)/D,vp=toOpen/D;
    if(projected>.5)s.to(1,{damping:.88,response:.4,velocity:vp});
    else closeLayer(vp);
  };
  area.addEventListener('pointerup',end);area.addEventListener('pointercancel',end);
}

/* ---------- passcode ---------- */
function lockScreen(){
  const el=document.createElement('div');el.className='lock';el.innerHTML=`<h1>מעקב כספים</h1><p>הקלידו את קוד הנעילה</p><form><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" aria-label="קוד נעילה" autofocus><div class="msg" role="alert"></div><button class="btn">פתיחה</button></form>`;
  document.body.appendChild(el);
  el.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=el.querySelector('button');b.disabled=true;
    try{await unlock(el.querySelector('#lp').value);el.remove();start()}catch(err){el.querySelector('.msg').textContent='הקוד שגוי. נסו שוב.';el.querySelector('#lp').value='';b.disabled=false}};
}
function setPass(){
  if(!(window.crypto&&crypto.subtle)){toast('נעילה בקוד זמינה רק כשהאפליקציה נטענת ב-https');return}
  openLayer(`<div class="sheet modal" role="dialog" aria-label="קוד נעילה"><header><span class="grab" aria-hidden="true"></span><button data-close>ביטול</button><h2>קוד נעילה</h2><span></span></header><div class="body"><form id="pfrm">
  <div class="err" id="perr" hidden role="alert"></div>
  <div class="grp"><div class="fld"><label for="p1">קוד חדש<small>לפחות 4 תווים</small></label><input id="p1" type="password" inputmode="numeric" autocomplete="new-password"></div>
  <div class="fld"><label for="p2">הקוד שוב</label><input id="p2" type="password" inputmode="numeric" autocomplete="new-password"></div></div>
  <p class="hint" style="padding-top:10px">בלי הקוד אי אפשר לפתוח את האפליקציה או לשחזר את הנתונים. שמרו גיבוי לפני שמפעילים נעילה.</p>
  <section><button class="btn">הפעלת נעילה</button></section></form></div></div>`);
  $('#pfrm').onsubmit=async e=>{e.preventDefault();const a=$('#p1').value,b=$('#p2').value,err=$('#perr');
    const msg=a.length<4?'הקוד קצר מדי. צריך לפחות 4 תווים.':a!==b?'שני הקודים לא זהים.':'';
    if(msg){err.textContent=msg;err.hidden=false;return}
    const salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await deriveKey(a,salt);encMeta={salt:b64(salt)};await save();closeLayer();render();toast('הנעילה הופעלה')};
}
async function rmPass(){if(!confirm('לבטל את הנעילה? הנתונים יישמרו במכשיר בלי הצפנה.'))return;cryptoKey=null;encMeta=null;await save();render();toast('הנעילה בוטלה')}

/* ---------- events / boot ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-acc],[data-edit],[data-close]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.acc)openAccount(t.dataset.acc);
  else if(t.dataset.edit)openForm(t.dataset.edit);
  else if('close' in t.dataset)closeLayer();
  else ({new:()=>ACCOUNTS.length?openForm():openImport(),backup:doBackup,csv:doCsv,import:openImport,setpass:setPass,rmpass:rmPass,
    wipe:async()=>{if(!confirm('למחוק את כל הנתונים מהמכשיר? אי אפשר לבטל את הפעולה.'))return;if(!confirm('בטוחים? ודאו שיש לכם גיבוי.'))return;S.updates=[];setConfig([]);await save();tab='home';render();toast('הנתונים נמחקו')}})[t.dataset.act]?.();
});
function start(){$('#tabbar').hidden=false;render()}
(function boot(){
  const raw=readRaw();
  if(raw&&raw.enc){lockScreen();return}
  if(raw&&raw.data){setConfig(raw.data.accounts);S.updates=clean(raw.data.updates)}
  start();
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
